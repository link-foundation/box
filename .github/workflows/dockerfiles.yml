name: Dockerfiles

# Static checks over the Dockerfiles that define the boxes.
#
# Why this workflow exists (issue #115): this repository *is* a collection of
# Dockerfiles, and no linter had ever read one. actionlint reads the workflows,
# scripts.yml reads every *.sh, and the 23 Dockerfiles were the one body of
# source with no check at all. `apt install` instead of `apt-get install` was
# sitting in ubuntu/24.04/js/Dockerfile and in nine install scripts, printing
# "WARNING: apt does not have a stable CLI interface" into every box build -
# a warning nobody was looking for, because nothing collected it.

on:
  push:
    branches:
      - main
    paths:
      # A GitHub filter pattern is matched against the whole path from the
      # repository root, and `**/` requires a directory, so '**/Dockerfile'
      # does not match the root Dockerfile - the one this repository's own
      # image is built from (issue #121).
      - 'Dockerfile'
      - '**/Dockerfile'
      - '**/Dockerfile.*'
      - '**/*.Dockerfile'
      - '.hadolint.yaml'
      - 'scripts/ci/run-hadolint.sh'
      - '.github/workflows/dockerfiles.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      # A GitHub filter pattern is matched against the whole path from the
      # repository root, and `**/` requires a directory, so '**/Dockerfile'
      # does not match the root Dockerfile - the one this repository's own
      # image is built from (issue #121).
      - 'Dockerfile'
      - '**/Dockerfile'
      - '**/Dockerfile.*'
      - '**/*.Dockerfile'
      - '.hadolint.yaml'
      - 'scripts/ci/run-hadolint.sh'
      - '.github/workflows/dockerfiles.yml'
  workflow_dispatch:

# Least-privilege default; this job only reads the checked-out tree.
permissions:
  contents: read

jobs:
  hadolint:
    name: dockerfiles / hadolint
    runs-on: ubuntu-24.04
    # Typical run: a few seconds once the image is pulled. The limit is here so
    # a hung docker pull cannot hold a runner for six hours.
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-hadolint
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Nothing here pushes; leaving the token in .git/config would only
          # widen what a compromised step could reach.
          persist-credentials: false

      # A pull_request checkout is GitHub's merge preview, computed when the
      # pull request was last synchronised and never recomputed as main moves.
      # Merge the base branch first, so this job reports on what merging would
      # actually produce (issue #115, best practice #7).
      - name: Simulate a fresh merge with the base branch
        uses: ./.github/actions/simulate-fresh-merge

      - name: List the Dockerfiles that will be checked
        run: bash scripts/ci/run-hadolint.sh --list

      # Threshold and the single ignored rule are in .hadolint.yaml, each with
      # the reason. Reproduce locally with the identical command:
      #   bash scripts/ci/run-hadolint.sh
      - name: hadolint every tracked Dockerfile
        run: bash scripts/ci/run-hadolint.sh

      # Also part of run-experiments.sh, which scripts.yml runs on any '**.sh'
      # or 'ubuntu/**' change - so the no-bare-apt policy it asserts is checked
      # even when a pull request touches no Dockerfile at all.
      - name: The runner's own fixtures still hold
        run: bash experiments/test-issue115-hadolint-gate.sh

  # === TERMINAL STATUS GATE ===
  #
  # The job that makes every other job's result reach the run's conclusion
  # (issue #121, reference-template best practice "every workflow gets a
  # terminal status gate").
  #
  # GitHub derives a run's conclusion from its jobs, and one cancellation
  # outranks any number of failures - so a run holding a failed job can still
  # come out grey, and everything that reads the run rather than each job (the
  # badge, `gh run list`, the run list quoted in issue #121 itself) reads that
  # as "no verdict" rather than "something broke". A gate's own conclusion is a
  # job conclusion, so when it errors the run is red no matter what else was
  # cancelled. The rationale, the measured run and the supersede-versus-overrun
  # rule are in scripts/ci/check-pipeline-status.sh.
  #
  # `!cancelled()`, not `always()`: cancelling a whole run is somebody's
  # decision and repainting it red would be a false positive, so this job is
  # skipped there. `cancelled()` is run-level, so a job cancelled on its own -
  # an overrun, or a per-job concurrency group firing - still reaches the gate.
  #
  # `needs` must name every other job in this file, or a job's result cannot
  # reach here at all. That is not left to review:
  # scripts/ci/check-status-gate-covers-all-jobs.mjs derives the list from this
  # workflow and fails when the two disagree.
  pipeline-status:
    name: pipeline-status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [hadolint]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Anonymous `git ls-remote` is enough to resolve the branch head, which is
      # how the script tells a superseded run from an overrun; no token is
      # persisted for it.
      - name: Check pipeline status
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: bash scripts/ci/check-pipeline-status.sh
