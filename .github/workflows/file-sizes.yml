name: File sizes

# The 1500-line limit, ported from the reference template's
# check-file-line-limits job (issue #115, R3/R5).
#
# Why this is a CI gate and not a style note: .github/workflows/release.yml had
# grown to 3135 lines with ten near-identical build jobs in it, and that size
# was itself a root cause (RC-8). A fix applied to one copy reached none of the
# others, which is how the missing `docker manifest create --amend` and the
# unguarded Docker Hub push both came back after being fixed. No reviewer reads
# 3135 lines of YAML, so nothing caught it.
#
# It is its own workflow rather than a job in Scripts, because it checks
# Markdown and YAML as well as shell, and a gate that skips the pull requests
# which only touch documentation is a gate with a hole in it.
#
# Reproduce locally with the identical command:
#   bash scripts/ci/check-file-line-limits.sh
#   bash scripts/ci/check-file-line-limits.sh --list   # what it would check

on:
  push:
    branches:
      - main
    paths:
      - '**.sh'
      - '**.md'
      - '**.yml'
      - '**.yaml'
      - '**.mjs'
      - '**.js'
      - '**.cjs'
      - '**.py'
      - '**.rb'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.sh'
      - '**.md'
      - '**.yml'
      - '**.yaml'
      - '**.mjs'
      - '**.js'
      - '**.cjs'
      - '**.py'
      - '**.rb'
  workflow_dispatch:

# Least-privilege default; this job only reads the checked-out tree.
permissions:
  contents: read

env:
  # actions/checkout's first act is `git init`, and a git with no configured
  # `init.defaultBranch` answers it with a thirteen-line advice block - "Using
  # 'master' as the name for the initial branch... this default branch name will
  # change" - at the top of every job log. 19 checkouts in the runs issue #121
  # lists printed 247 lines of it, in jobs where nothing was wrong. No step can
  # fix it, because it is printed before the first step of ours runs; git reads
  # configuration from the environment too, and the environment is there from
  # the start. Ported from the js template, which carries the same three lines
  # with the same reasoning.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  line-limits:
    name: file sizes / line limits
    runs-on: ubuntu-24.04
    # Typical run: under 10 seconds. It counts lines in tracked files.
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-line-limits
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Nothing here pushes; leaving the token in .git/config would only
          # widen what a compromised step could reach.
          persist-credentials: false

      # A pull_request checkout is GitHub's merge preview, computed when the
      # pull request was last synchronised and never recomputed as main moves.
      # Merge the base branch first, so this job reports on what merging would
      # actually produce (issue #115, best practice #7).
      - name: Simulate a fresh merge with the base branch
        uses: ./.github/actions/simulate-fresh-merge

      # Printed before the check runs, so a failure comes with the list of
      # files the check was looking at. A gate that examined nothing exits 0
      # and reads exactly like a clean tree (RC-16); the script fails with
      # exit 2 in that case, and this step makes it visible.
      - name: List the files that will be checked
        run: bash scripts/ci/check-file-line-limits.sh --list

      - name: Every maintained file is under the line limit
        run: bash scripts/ci/check-file-line-limits.sh

      - name: The gate's own fixtures still hold
        if: ${{ !cancelled() }}
        run: bash experiments/test-issue115-line-limits.sh

  # === TERMINAL STATUS GATE ===
  #
  # The job that makes every other job's result reach the run's conclusion
  # (issue #121, reference-template best practice "every workflow gets a
  # terminal status gate").
  #
  # GitHub derives a run's conclusion from its jobs, and one cancellation
  # outranks any number of failures - so a run holding a failed job can still
  # come out grey, and everything that reads the run rather than each job (the
  # badge, `gh run list`, the run list quoted in issue #121 itself) reads that
  # as "no verdict" rather than "something broke". A gate's own conclusion is a
  # job conclusion, so when it errors the run is red no matter what else was
  # cancelled. The rationale, the measured run and the supersede-versus-overrun
  # rule are in scripts/ci/check-pipeline-status.sh.
  #
  # `!cancelled()`, not `always()`: cancelling a whole run is somebody's
  # decision and repainting it red would be a false positive, so this job is
  # skipped there. `cancelled()` is run-level, so a job cancelled on its own -
  # an overrun, or a per-job concurrency group firing - still reaches the gate.
  #
  # `needs` must name every other job in this file, or a job's result cannot
  # reach here at all. That is not left to review:
  # scripts/ci/check-status-gate-covers-all-jobs.mjs derives the list from this
  # workflow and fails when the two disagree.
  pipeline-status:
    name: pipeline-status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [line-limits]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Anonymous `git ls-remote` is enough to resolve the branch head, which is
      # how the script tells a superseded run from an overrun; no token is
      # persisted for it.
      - name: Check pipeline status
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: bash scripts/ci/check-pipeline-status.sh
