name: Measure Disk Space and Update README

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/ubuntu-24-server-install.sh'
      - 'scripts/measure-disk-space.sh'
      - 'scripts/update-readme-sizes.sh'
      - 'Dockerfile'
      - '.github/workflows/measure-disk-space.yml'
  # The measurement itself takes ~3 hours and pushes to main, so it cannot run
  # on a pull request. What CAN run on a pull request is everything that decides
  # whether the measurement is going to work at all — and it has to, because
  # this workflow only ever ran after the merge. Run 33972074753 (main, commit
  # 42be663) is the case in point: `NODE_MAJOR: unbound variable` was
  # introduced, reviewed and merged without a single job ever executing the
  # changed script (issue #115).
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/ubuntu-24-server-install.sh'
      - 'scripts/measure-disk-space.sh'
      - 'scripts/update-readme-sizes.sh'
      - 'ubuntu/24.04/common.sh'
      - 'data/disk-space-measurements.json'
      - '.github/workflows/measure-disk-space.yml'
      # The preflight and validation jobs, which are what a pull request can
      # run here, are the only place these three are executed at all. They are
      # deliberately absent from the push filter above: editing a validator
      # should re-run the validation, not spend three hours measuring disk.
      - 'scripts/ci/extract-quoted-heredoc.sh'
      - 'scripts/ci/validate-measurements.py'
      - 'scripts/ci/summarize-measurements.py'
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update README even if no changes detected'
        required: false
        type: boolean
        default: false
      verbose:
        description: 'Trace what the measurement script resolves, generates and hands to the box user (BOX_VERBOSE=1)'
        required: false
        type: boolean
        default: false

# Least-privilege default; the measurement job escalates to `contents: write`
# for its push. The validation job never needs more than a read.
permissions:
  contents: read

env:
  # actions/checkout's first act is `git init`, and a git with no configured
  # `init.defaultBranch` answers it with a thirteen-line advice block - "Using
  # 'master' as the name for the initial branch... this default branch name will
  # change" - at the top of every job log. 19 checkouts in the runs issue #121
  # lists printed 247 lines of it, in jobs where nothing was wrong. No step can
  # fix it, because it is printed before the first step of ours runs; git reads
  # configuration from the environment too, and the environment is there from
  # the start. Ported from the js template, which carries the same three lines
  # with the same reasoning.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  # Fast pre-merge gate. Nothing here installs anything, so it finishes in
  # under a minute and can run on every pull request that touches the scripts.
  validate:
    name: Validate measurement scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-validate
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # A pull_request checkout is GitHub's merge preview, computed when the
      # pull request was last synchronised and never recomputed as main moves.
      # Merge the base branch first, so this job reports on what merging would
      # actually produce (issue #115, best practice #7).
      - name: Simulate a fresh merge with the base branch
        uses: ./.github/actions/simulate-fresh-merge

      - name: Syntax-check the scripts
        run: |
          for f in scripts/measure-disk-space.sh scripts/ubuntu-24-server-install.sh scripts/update-readme-sizes.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      # The generated script is written from a quoted heredoc, so `bash -n` on
      # the parent says nothing about it. Extract it and check it separately.
      #
      # The extraction used to be an inline awk pattern that hardcoded the
      # spacing of the opener (`cat > /tmp/box-measure.sh <<`). shfmt then
      # reformatted the script to `cat >/tmp/box-measure.sh <<'EOF_BOX'` and the
      # pattern matched nothing, failing this job on every push (issue #115,
      # RC-22). The extraction now matches what bash parses rather than how the
      # line happens to be formatted, and says which of "no opener", "no
      # terminator" and "empty body" it hit.
      - name: Syntax-check the generated box-user script
        run: |
          bash scripts/ci/extract-quoted-heredoc.sh \
            scripts/measure-disk-space.sh EOF_BOX > /tmp/generated-measure.sh
          echo "extracted $(wc -l < /tmp/generated-measure.sh) lines"
          bash -n /tmp/generated-measure.sh

      - name: Check for variables leaking out of quoted heredocs
        run: bash scripts/ci/check-heredoc-vars.sh

      - name: Regression tests for issue #115
        run: bash experiments/test-issue115-heredoc-unbound-vars.sh

      # Argument handling is the other half of what broke: the documented
      # no-argument invocation used to abort on `$1: unbound variable`.
      - name: Check the command line interface
        run: |
          ./scripts/measure-disk-space.sh --help > /dev/null
          if ./scripts/measure-disk-space.sh --not-an-option 2>/dev/null; then
            echo "::error::an unknown option must be rejected"; exit 1
          fi

      # The committed measurements feed the README table; a malformed file
      # would only be noticed three hours into the next measurement run.
      - name: Validate the committed measurements
        run: python3 scripts/ci/validate-measurements.py data/disk-space-measurements.json

  measure-disk-space:
    name: Measure Component Disk Space
    # Pull requests stop at `validate`; measuring installs every toolchain on a
    # bare runner and ends in a push to main.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    # 180 was "3 hours max for full installation measurement" - a number nobody
    # had checked against a run. Every successful run of this job in the
    # repository's history finished inside 23.3 minutes, the slowest of them in
    # February (dev/log/issues/121/pulls/122/analysis/); 60 leaves more than
    # twice that and still bounds a hang at an hour instead of three (issue
    # #121, docs/CI-TIMEOUT-BUDGETS.md).
    timeout-minutes: 60
    # This job commits to main. Cancelling it mid-`git push` is worse than
    # letting a superseded run finish, so it queues instead of cancelling —
    # unlike the pre-merge checks above.
    concurrency:
      group: measure-disk-space-${{ github.ref }}
      cancel-in-progress: false

    # pull-requests: write is for the fallback path in
    # scripts/release/git-push-with-retry.sh only (issue #121).
    permissions:
      contents: write
      pull-requests: write

    env:
      # Off by default. `workflow_dispatch` can turn it on without editing the
      # workflow, which is the whole point of having it (issue #115).
      BOX_VERBOSE: ${{ inputs.verbose && '1' || '0' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Kept, unlike every other checkout here: this job commits the
          # measured table back to main, so the push needs the credential
          # checkout leaves in .git/config. Stated rather than left to the
          # default, so the one job that needs it is the one that says so.
          persist-credentials: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Free up disk space
        run: |
          echo "=== Initial disk space ==="
          df -h /

          echo ""
          echo "=== Freeing up disk space ==="

          # Remove large directories that won't affect apt functionality
          # NOTE: We intentionally do NOT run apt-get remove/autoremove as it breaks
          # package installation. See docs/case-studies/issue-29 for details.
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

          # Refresh apt cache to ensure all packages are available
          source ubuntu/24.04/common.sh
          apt_update_with_retry

          echo ""
          echo "=== Disk space after cleanup ==="
          df -h /

      - name: Create data directory
        run: mkdir -p data

      - name: Run disk space measurement
        id: measure
        run: |
          set -o pipefail
          echo "=== Starting disk space measurement ==="

          # Make script executable
          chmod +x scripts/measure-disk-space.sh

          # sudo resets the environment (env_reset), so BOX_VERBOSE has to be
          # handed over explicitly rather than merely exported here.
          # pipefail ensures script failures propagate through tee.
          # The budget wraps the measurement, not the pipeline: `tee` has to
          # stay outside it so the log survives an overrun, and `pipefail` above
          # still carries the wrapper's exit status - 124 when it runs out of
          # budget (issue #121, docs/CI-TIMEOUT-BUDGETS.md).
          bash scripts/ci/run-with-budget-warning.sh 2400 "disk space measurement" \
            sudo env "BOX_VERBOSE=$BOX_VERBOSE" ./scripts/measure-disk-space.sh \
            --json-output data/disk-space-measurements.json 2>&1 | tee measurement.log

          echo "=== Measurement complete ==="

          # Check if JSON was created
          if [ -f data/disk-space-measurements.json ]; then
            echo "json_created=true" >> "$GITHUB_OUTPUT"
            echo ""
            echo "=== Measurements JSON ==="
            cat data/disk-space-measurements.json
          else
            echo "json_created=false" >> "$GITHUB_OUTPUT"
            echo "::error::JSON file was not created"
            exit 1
          fi

      - name: Update README with component sizes
        if: steps.measure.outputs.json_created == 'true'
        env:
          JSON_FILE: data/disk-space-measurements.json
          README_FILE: README.md
        run: |
          chmod +x scripts/update-readme-sizes.sh
          ./scripts/update-readme-sizes.sh

          echo ""
          echo "=== Updated README section ==="
          sed -n '/<!-- COMPONENT_SIZES_START -->/,/<!-- COMPONENT_SIZES_END -->/p' README.md || echo "No markers found in README"

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet README.md data/disk-space-measurements.json 2>/dev/null; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected:"
            git diff --stat README.md data/disk-space-measurements.json 2>/dev/null || true
          fi

      # The thresholds used to be compared with `[ -lt ]`, but total_size_mb is
      # a float ("7286.0"), so that test never once evaluated: bash printed
      # "integer expression expected", returned 2, and the `||` fell through to
      # "valid". A measurement reporting 5 MB with a plausible component count
      # would have been committed as good. The checks live in a script now, so
      # they are testable and shared with the pull request gate (issue #115).
      #
      # `if ... then valid=true else valid=false` was wrong in the same way the
      # `[ -lt ]` test was, one level up: the validator documents 0 = valid,
      # 1 = invalid, 2 = usage error, and argparse exits 2 as well - so a
      # SyntaxError, a renamed flag or a missing file all read as "these
      # measurements are invalid" and quietly threw away three hours of work
      # with the job green (issue #121). Only 1 means invalid. Anything else
      # means the question was not answered, which is an error, not a verdict.
      - name: Validate measurements
        id: validate
        run: |
          set +e
          python3 scripts/ci/validate-measurements.py data/disk-space-measurements.json
          rc=$?
          set -e
          case "$rc" in
            0)
              echo "valid=true" >> "$GITHUB_OUTPUT"
              ;;
            1)
              echo "valid=false" >> "$GITHUB_OUTPUT"
              echo "::warning::The measurements are invalid; nothing will be committed."
              ;;
            *)
              echo "::error title=Measurement validation could not run::validate-measurements.py exited $rc, which is neither valid (0) nor invalid (1). The measurement is not being discarded on the strength of an answer nobody got."
              exit 1
              ;;
          esac

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true' && steps.validate.outputs.valid == 'true'
        env:
          # Only read on the fallback path, when a repository rule declines the
          # direct push and the commit has to arrive as a pull request.
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add README.md data/disk-space-measurements.json

          # Create commit message with summary
          TOTAL_SIZE=$(python3 -c "import json; print(json.load(open('data/disk-space-measurements.json'))['total_size_mb'])" 2>/dev/null || echo "unknown")

          # Guarded like every other commit in this repository: the subject is
          # generated here, but the diffstat and file list git prints with it
          # are not, and one exception is how the invariant stops holding
          # (issue #123).
          bash scripts/ci/run-with-commands-stopped.sh git commit -m "chore: update component disk space measurements (${TOTAL_SIZE}MB total)"

          # This job runs for about 18 minutes before it pushes, which is a wide
          # window for the release workflow to land a version bump. A single
          # pull-rebase closes most of it but not the seconds between the
          # rebase and the push, and it never retries; the helper rebases and
          # retries, and answers a repository-rule rejection with a pull
          # request rather than a rebase that cannot satisfy it (issue #121,
          # and see docs/case-studies/issue-51 for the original race).
          # Measurement data (README.md, data/) and version bumps (VERSION)
          # touch different files, so the rebase resolves cleanly.
          bash scripts/release/git-push-with-retry.sh origin main "disk-space-measurements"

          echo "Changes committed and pushed successfully"

      # Deliberately NOT gated on has_changes. It used to be, which meant a
      # measurement that was invalid AND identical to the committed one passed
      # the workflow silently — the failure mode that keeps a broken number in
      # the README for as long as it stays broken.
      - name: Fail on invalid measurements
        if: steps.validate.outputs.valid != 'true'
        run: |
          echo "::error::Invalid measurements detected. Not committing to prevent data corruption."
          echo "Please investigate the measurement logs and fix the underlying issue."
          exit 1

      # Always upload, especially on failure: measurement.log is the only record
      # of what the three-hour run did, and a plain step without `if:` is
      # skipped as soon as anything above it fails — which is exactly when the
      # log is wanted (issue #115).
      - name: Upload measurement artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: disk-space-measurements
          path: |
            data/disk-space-measurements.json
            measurement.log
          retention-days: 30
          if-no-files-found: warn

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Disk Space Measurement Results"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f data/disk-space-measurements.json ]; then
            python3 scripts/ci/summarize-measurements.py data/disk-space-measurements.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Measurement JSON not found" >> "$GITHUB_STEP_SUMMARY"
          fi

  # === TERMINAL STATUS GATE ===
  #
  # The job that makes every other job's result reach the run's conclusion
  # (issue #121, reference-template best practice "every workflow gets a
  # terminal status gate").
  #
  # GitHub derives a run's conclusion from its jobs, and one cancellation
  # outranks any number of failures - so a run holding a failed job can still
  # come out grey, and everything that reads the run rather than each job (the
  # badge, `gh run list`, the run list quoted in issue #121 itself) reads that
  # as "no verdict" rather than "something broke". A gate's own conclusion is a
  # job conclusion, so when it errors the run is red no matter what else was
  # cancelled. The rationale, the measured run and the supersede-versus-overrun
  # rule are in scripts/ci/check-pipeline-status.sh.
  #
  # `!cancelled()`, not `always()`: cancelling a whole run is somebody's
  # decision and repainting it red would be a false positive, so this job is
  # skipped there. `cancelled()` is run-level, so a job cancelled on its own -
  # an overrun, or a per-job concurrency group firing - still reaches the gate.
  #
  # `needs` must name every other job in this file, or a job's result cannot
  # reach here at all. That is not left to review:
  # scripts/ci/check-status-gate-covers-all-jobs.mjs derives the list from this
  # workflow and fails when the two disagree.
  pipeline-status:
    name: pipeline-status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [validate, measure-disk-space]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Anonymous `git ls-remote` is enough to resolve the branch head, which is
      # how the script tells a superseded run from an overrun; no token is
      # persisted for it.
      - name: Check pipeline status
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: bash scripts/ci/check-pipeline-status.sh
