name: PR Tests

# Called by .github/workflows/release.yml. It is not triggered directly: a
# `workflow_call` file has no other trigger, so it never starts a run of its own.
#
# Why it is a separate file (issue #115, RC-8). release.yml had grown to 3135
# lines - more than twice the 1500-line limit the reference CI/CD template
# enforces (scripts/check-file-line-limits.sh there, scripts/ci/check-file-line-limits.sh
# here). At that size a defect fixed in one of the near-identical build jobs kept
# surviving in the others, which is how RC-4 and RC-7 came back after being
# fixed. The file is split by image family; the job graph is unchanged.

on:
  workflow_call:
    inputs:
      changes:
        description: 'JSON object of the detect-changes job outputs'
        required: true
        type: string
      detect-changes-result:
        description: 'Result of the detect-changes job'
        required: true
        type: string
      version-check-result:
        description: 'Result of the version-check job'
        required: true
        type: string
      changeset-check-result:
        description: 'Result of the changeset-check job'
        required: true
        type: string

permissions:
  contents: read

env:
  # actions/checkout's first act is `git init`, and a git with no configured
  # `init.defaultBranch` answers it with a thirteen-line advice block - "Using
  # 'master' as the name for the initial branch... this default branch name will
  # change" - at the top of every job log. 19 checkouts in the runs issue #121
  # lists printed 247 lines of it, in jobs where nothing was wrong. No step can
  # fix it, because it is printed before the first step of ours runs; git reads
  # configuration from the environment too, and the environment is there from
  # the start. Ported from the js template, which carries the same three lines
  # with the same reasoning.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:

  # === BUILD AND TEST DOCKER IMAGES (PR) — issue #82 ===
  #
  # On every pull request we exercise *all* image configurations in parallel,
  # each on its own clean GitHub-hosted VM with maximum free disk space. The
  # parallel layout mirrors the production release matrix:
  #
  #   pr-test-js               (1 job)      - JS base box
  #   pr-test-essentials       (1 job)      - essentials box on JS
  #   pr-test-language         (matrix: 11) - one job per language box
  #   pr-test-full             (1 job)      - full-box (all languages)
  #   pr-test-dind             (matrix: 14) - one job per dind variant
  #                                            (js, essentials, 11 languages, full)
  #   docker-build-test        (1 job)      - aggregator for branch protection
  #
  # Each job rebuilds its required base chain locally with plain `docker build`
  # against the host Docker daemon. We deliberately do NOT use buildx with the
  # docker-container driver here because subsequent `FROM box-js` /
  # `FROM box-essentials` resolution in that driver would attempt a registry
  # pull (which fails on PR forks and on Docker Hub outages). The trade-off is
  # that each VM rebuilds JS and essentials from source — fine because every VM
  # has 30 GB freed up front and the parallel matrix means wall-clock is bound
  # by the slowest single image, not by the depth of the chain.
  #
  # Every build job frees ~30 GB before building, fixing the "no space left on
  # device" regression captured in run 25075335426 (see
  # docs/case-studies/issue-82/). The step is `./.github/actions/free-disk-space`
  # rather than the upstream action it wraps: upstream removes a fixed list of
  # package names, and `google-chrome-stable` has no arm64 apt source, so on
  # every arm64 job apt exited 100 without removing any of the batch and the
  # action turned that into a warning - 28 of them on release run 34293699247,
  # which was green. The wrapper asks dpkg what is installed first, so the same
  # packages go and nothing is annotated (issue #121).
  #
  # pr-test-full and pr-test-dind's `full` variant are the two jobs that have to
  # hold the whole chain - JS, essentials, 11 language images and the full box -
  # on one VM at once, and they are the two that kept dying mid-build (run
  # 34259552358, SIGKILL during the full box's `exporting layers`). Both sample
  # memory and disk while they build (scripts/ci/resource-monitor.sh), and those
  # samples name the resource: the export grows to 18.8 GB of committed memory
  # on a 16 GB runner while 88 GB of disk stays free, so both jobs reclaim the
  # tool cache they never use, keep the kernel's swap, and turn a slice of the
  # idle disk into more of it (scripts/ci/ensure-swap.sh). The free-disk-space
  # step is job-level, so the other 13 dind variants inherit the same reclaim -
  # which costs them nothing - while the swap step is gated on the variant that
  # needs it.
  #
  # See: docs/case-studies/issue-82/CASE-STUDY.md

  # --- Tier 0: version policy (no image build, runs in seconds) ---
  # The resolvers in ubuntu/24.04/common.sh are the only thing keeping a rebuild
  # from shipping last year's runtimes (issue #112), and refresh-rust.sh depends
  # on a layer property (a delete after COPY --from reclaims nothing) that is
  # easy to regress. Both are covered without building an image, so this job
  # gates the expensive tiers below.
  pr-test-version-policy:
    name: pr-test / version-policy
    runs-on: ubuntu-24.04
    # Caps are sized from what the jobs actually take, measured over the last
    # 300 runs and tabulated in docs/CI-TIMEOUT-BUDGETS.md; this one has never
    # exceeded 1.1 minutes. A cap far above the work it bounds is not free
    # caution - it is the number of minutes a hung job burns before anyone hears
    # about it (issue #121).
    timeout-minutes: 10
    if: |
      !cancelled() &&
      (inputs.version-check-result == 'success' || inputs.version-check-result == 'skipped') &&
      (inputs.changeset-check-result == 'success' || inputs.changeset-check-result == 'skipped') &&
      github.event_name == 'pull_request'
    # The guard below cancels this run when its commit is superseded, which
    # needs write access to the Actions API (issue #112 follow-up).
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # A queued matrix job can start long after the run was created, by which
      # time the pull request may have moved on (issue #112 follow-up). Check
      # before spending a runner on a commit nobody is waiting for.
      - name: Stop if a newer commit superseded this run
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bash scripts/ci/supersede.sh stop-if-superseded
          # ...and keep watching from inside the job. Cancelling from the
          # outside needs a free runner, and a superseded run holding every
          # slot is exactly why there is none.
          setsid nohup bash scripts/ci/supersede.sh watch \
            > "$RUNNER_TEMP/supersede-watch.log" 2>&1 < /dev/null &

      # A pull_request checkout is GitHub's merge preview, computed when the
      # pull request was last synchronised and never recomputed as main moves.
      # Merge the base branch first, so this job reports on what merging would
      # actually produce (issue #115, best practice #7).
      - name: Simulate a fresh merge with the base branch
        uses: ./.github/actions/simulate-fresh-merge

      - name: Version resolvers and one-version-per-language invariant
        run: bash experiments/version-policy-unit-test.sh

      - name: Layer semantics behind the rustup refresh
        run: bash experiments/rust-refresh-layer-test.sh

      - name: Superseded-commit guard (stubbed API) and its workflow wiring
        run: bash experiments/test-issue112-supersede.sh

      - name: Resolvers agree with the live upstream feeds
        # Not an assertion on a specific version — it fails only if a feed
        # changed shape and every resolver silently fell back to its pin.
        run: |
          set -e
          . ubuntu/24.04/common.sh
          for fn in resolve_node_lts_major resolve_nvm_version resolve_java_lts_major \
                    resolve_dotnet_lts_channel resolve_swift_versions resolve_opam_version; do
            value="$("$fn" | head -n1)"
            echo "$fn -> $value"
            [ -n "$value" ] || { echo "::error::$fn returned nothing"; exit 1; }
          done

  # --- Tier 1: JS box ---
  pr-test-js:
    name: pr-test / js
    runs-on: ubuntu-24.04
    # Measured maximum 7.9 minutes; the budgets below reserve 13 of these 20.
    timeout-minutes: 20
    needs: [pr-test-version-policy]
    if: |
      !cancelled() &&
      inputs.detect-changes-result == 'success' &&
      (inputs.version-check-result == 'success' || inputs.version-check-result == 'skipped') &&
      (inputs.changeset-check-result == 'success' || inputs.changeset-check-result == 'skipped') &&
      github.event_name == 'pull_request' &&
      fromJSON(inputs.changes)['should-build'] == 'true'
    # The guard below cancels this run when its commit is superseded, which
    # needs write access to the Actions API (issue #112 follow-up).
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # A queued matrix job can start long after the run was created, by which
      # time the pull request may have moved on (issue #112 follow-up). Check
      # before spending a runner on a commit nobody is waiting for.
      - name: Stop if a newer commit superseded this run
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bash scripts/ci/supersede.sh stop-if-superseded
          # ...and keep watching from inside the job. Cancelling from the
          # outside needs a free runner, and a superseded run holding every
          # slot is exactly why there is none.
          setsid nohup bash scripts/ci/supersede.sh watch \
            > "$RUNNER_TEMP/supersede-watch.log" 2>&1 < /dev/null &

      # A pull_request checkout is GitHub's merge preview, computed when the
      # pull request was last synchronised and never recomputed as main moves.
      # Merge the base branch first, so this job reports on what merging would
      # actually produce (issue #115, best practice #7).
      - name: Simulate a fresh merge with the base branch
        uses: ./.github/actions/simulate-fresh-merge

      - name: Free disk space
        uses: ./.github/actions/free-disk-space
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # Every build and test step below owns an execution budget rather than
      # relying on the job's `timeout-minutes` (issue #121,
      # docs/CI-TIMEOUT-BUDGETS.md). A job killed by `timeout-minutes` is
      # reported *cancelled*, stops where it stands, and names neither the step
      # nor the deadline; a step that fails names both and leaves the rest of
      # the job's reporting running. The cap stays as the backstop for the parts
      # of a job no budget covers, and scripts/ci/check-timeout-budgets.mjs
      # keeps each budget - and their concurrent total - inside it.
      - name: Build JS box (amd64)
        run: |
          bash scripts/ci/run-with-budget-warning.sh 600 "JS box build" \
            bash scripts/ci/build-chain.sh js

      - name: Test JS box
        run: |
          bash scripts/ci/run-with-budget-warning.sh 180 "JS box tests" \
            bash scripts/ci/test-box.sh js box-js

  # --- Tier 2: essentials box ---
  pr-test-essentials:
    name: pr-test / essentials
    runs-on: ubuntu-24.04
    # Measured maximum 6.5 minutes; the budgets below reserve 13 of these 20.
    timeout-minutes: 20
    needs: [pr-test-js]
    if: |
      !cancelled() &&
      needs.pr-test-js.result == 'success' &&
      github.event_name == 'pull_request' &&
      fromJSON(inputs.changes)['should-build'] == 'true'
    # The guard below cancels this run when its commit is superseded, which
    # needs write access to the Actions API (issue #112 follow-up).
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # A queued matrix job can start long after the run was created, by which
      # time the pull request may have moved on (issue #112 follow-up). Check
      # before spending a runner on a commit nobody is waiting for.
      - name: Stop if a newer commit superseded this run
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bash scripts/ci/supersede.sh stop-if-superseded
          # ...and keep watching from inside the job. Cancelling from the
          # outside needs a free runner, and a superseded run holding every
          # slot is exactly why there is none.
          setsid nohup bash scripts/ci/supersede.sh watch \
            > "$RUNNER_TEMP/supersede-watch.log" 2>&1 < /dev/null &

      # A pull_request checkout is GitHub's merge preview, computed when the
      # pull request was last synchronised and never recomputed as main moves.
      # Merge the base branch first, so this job reports on what merging would
      # actually produce (issue #115, best practice #7).
      - name: Simulate a fresh merge with the base branch
        uses: ./.github/actions/simulate-fresh-merge

      - name: Free disk space
        uses: ./.github/actions/free-disk-space
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Build JS + essentials chain
        run: |
          bash scripts/ci/run-with-budget-warning.sh 600 "essentials chain build" \
            bash scripts/ci/build-chain.sh essentials

      - name: Test essentials box
        run: |
          bash scripts/ci/run-with-budget-warning.sh 180 "essentials box tests" \
            bash scripts/ci/test-box.sh essentials box-essentials

  # --- Tier 3: per-language boxes (parallel matrix, one VM each) ---
  pr-test-language:
    name: pr-test / ${{ matrix.language }}
    runs-on: ubuntu-24.04
    # Stays at 45: rocq, the slowest leg, has been measured at 20.4 minutes and
    # the budgets below reserve 30 of these 45.
    timeout-minutes: 45
    needs: [pr-test-version-policy, pr-test-essentials]
    if: |
      !cancelled() &&
      needs.pr-test-essentials.result == 'success' &&
      github.event_name == 'pull_request' &&
      fromJSON(inputs.changes)['should-build'] == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Every directory under ubuntu/24.04/ that ships a standalone
        # Dockerfile, not just the ones that get published as images: cpp,
        # assembly, dotnet and r were documented in README and built by nobody,
        # so a broken install.sh there reached users unreported (issue #115).
        # experiments/test-issue115-language-coverage.sh keeps this list equal
        # to the directory listing.
        language: [python, go, rust, java, kotlin, ruby, php, perl, swift, lean, rocq, cpp, assembly, dotnet, r]
    # The guard below cancels this run when its commit is superseded, which
    # needs write access to the Actions API (issue #112 follow-up).
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # A queued matrix job can start long after the run was created, by which
      # time the pull request may have moved on (issue #112 follow-up). Check
      # before spending a runner on a commit nobody is waiting for.
      - name: Stop if a newer commit superseded this run
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bash scripts/ci/supersede.sh stop-if-superseded
          # ...and keep watching from inside the job. Cancelling from the
          # outside needs a free runner, and a superseded run holding every
          # slot is exactly why there is none.
          setsid nohup bash scripts/ci/supersede.sh watch \
            > "$RUNNER_TEMP/supersede-watch.log" 2>&1 < /dev/null &

      # A pull_request checkout is GitHub's merge preview, computed when the
      # pull request was last synchronised and never recomputed as main moves.
      # Merge the base branch first, so this job reports on what merging would
      # actually produce (issue #115, best practice #7).
      - name: Simulate a fresh merge with the base branch
        uses: ./.github/actions/simulate-fresh-merge

      - name: Free disk space
        uses: ./.github/actions/free-disk-space
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # 1500s is a little under three times the slowest chain measured over the
      # last 200 runs (rocq, 1061s); see docs/CI-TIMEOUT-BUDGETS.md.
      - name: Build JS + essentials + ${{ matrix.language }} chain
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          bash scripts/ci/run-with-budget-warning.sh 1500 "${LANGUAGE} chain build" \
            bash scripts/ci/build-chain.sh "$LANGUAGE"

      - name: Test ${{ matrix.language }} box
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          bash scripts/ci/run-with-budget-warning.sh 300 "${LANGUAGE} box tests" \
            bash scripts/ci/test-box.sh "$LANGUAGE" "box-$LANGUAGE"

  # --- Tier 4: full box (integration smoke test, all languages on one VM) ---
  pr-test-full:
    name: pr-test / full
    runs-on: ubuntu-24.04
    # Stays at 90: measured at 43.0 minutes, and the budgets below reserve 60
    # of these 90 for a chain that pages through swap when it exports.
    timeout-minutes: 90
    needs: [pr-test-language]
    if: |
      !cancelled() &&
      needs.pr-test-language.result == 'success' &&
      github.event_name == 'pull_request' &&
      fromJSON(inputs.changes)['should-build'] == 'true'
    # The guard below cancels this run when its commit is superseded, which
    # needs write access to the Actions API (issue #112 follow-up).
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # A queued matrix job can start long after the run was created, by which
      # time the pull request may have moved on (issue #112 follow-up). Check
      # before spending a runner on a commit nobody is waiting for.
      - name: Stop if a newer commit superseded this run
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bash scripts/ci/supersede.sh stop-if-superseded
          # ...and keep watching from inside the job. Cancelling from the
          # outside needs a free runner, and a superseded run holding every
          # slot is exactly why there is none.
          setsid nohup bash scripts/ci/supersede.sh watch \
            > "$RUNNER_TEMP/supersede-watch.log" 2>&1 < /dev/null &

      # A pull_request checkout is GitHub's merge preview, computed when the
      # pull request was last synchronised and never recomputed as main moves.
      # Merge the base branch first, so this job reports on what merging would
      # actually produce (issue #115, best practice #7).
      - name: Simulate a fresh merge with the base branch
        uses: ./.github/actions/simulate-fresh-merge

      - name: Free disk space
        uses: ./.github/actions/free-disk-space
        with:
          # The two full-chain jobs are the only ones that hold every language
          # image and the full box on one VM at the same time, so they reclaim
          # more than the others (issue #119 follow-up):
          #
          #   tool-cache  /opt/hostedtoolcache is ~8 GB of Python/Node/Go/Ruby
          #               builds for `actions/setup-*`. Nothing here calls one:
          #               these jobs run bash and docker, and the Node that
          #               `actions/checkout` needs lives in the runner's own
          #               externals directory, not in the tool cache.
          #   swap        removing it reclaims nothing on this image - there is
          #               no /mnt filesystem for /mnt/swapfile to be on (see the
          #               `df -a` in run 34259552358) - while `swapoff -a` still
          #               takes away every page of swap the kernel had. That is
          #               the wrong side of the trade for a job whose build was
          #               last seen being SIGKILLed.
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      # Disk is not what these jobs run out of. With the sampler below in
      # place, run 34278116323 (job 102247036552) recorded the full box's
      # export climbing from 2.3 GB to 18.8 GB committed - RAM plus every page
      # of swap - in 4.5 minutes, while the root filesystem gained 11 MB and
      # kept 88 GB free. The runner has 16 GB of RAM and larger runners are not
      # available here, so the headroom comes from the disk that measurement
      # shows sitting idle (issue #119 follow-up).
      - name: Trade idle disk for swap the full-box export can grow into
        run: bash scripts/ci/ensure-swap.sh

      - name: Build full chain (JS -> essentials -> languages -> full)
        run: |
          set -e
          # Keep sampling memory, disk and the biggest processes into this
          # step's own log. That is what turned the SIGKILL in run 34259552358
          # into a diagnosis in run 34278116323, and it is how the swap step
          # above gets checked: the export's committed memory should now cross
          # 16 GB and keep going instead of taking the runner down with it.
          bash scripts/ci/resource-monitor.sh &
          RESOURCE_MONITOR_PID=$!
          trap 'kill "$RESOURCE_MONITOR_PID" 2>/dev/null || true' EXIT

          # 3000s against a slowest-measured 2342s: the smallest budget that
          # still clears the run where the full box's export paged into swap
          # (docs/CI-TIMEOUT-BUDGETS.md). The chain itself lives in
          # scripts/ci/build-chain.sh, which derives the language list from
          # ubuntu/24.04/full-box/Dockerfile rather than repeating it here.
          bash scripts/ci/run-with-budget-warning.sh 3000 "full chain build" \
            bash scripts/ci/build-chain.sh full

      - name: Test full box
        env:
          # The standalone PHP box is the source of /home/box/.php-install-method
          # in the full box; printing both catches a COPY that silently took the
          # wrong stage.
          PHP_METHOD_REFERENCE_IMAGE: box-php
        run: |
          bash scripts/ci/run-with-budget-warning.sh 600 "full box tests" \
            bash scripts/ci/test-box.sh full box-full

  # --- Tier 5: dind-box variants (parallel matrix: 14 variants, one VM each) — issue #80 ---
  # Each dind variant rebuilds its base chain (JS + essentials + optional lang/full)
  # locally and then layers dind on top, so this matrix only depends on
  # pr-test-essentials having validated the base layer; it can run in parallel
  # with the per-language and full-box jobs to minimise wall-clock time.
  pr-test-dind:
    name: pr-test / dind-${{ matrix.variant }}
    runs-on: ubuntu-24.04
    # 60 minutes fits 13 of the 14 variants with room to spare. The `full` one
    # reaches the full box's export around 37 minutes in and then spends that
    # export paging - which is the point of the swap step below, and slower than
    # RAM by construction. Killing it at 60 would report a timeout for a build
    # that is making progress (issue #119 follow-up).
    timeout-minutes: ${{ matrix.variant == 'full' && 90 || 60 }}
    needs: [pr-test-version-policy, pr-test-essentials]
    if: |
      !cancelled() &&
      needs.pr-test-essentials.result == 'success' &&
      github.event_name == 'pull_request' &&
      fromJSON(inputs.changes)['should-build'] == 'true'
    strategy:
      fail-fast: false
      matrix:
        # variant -> base box flavour. Special value "full" rebuilds the entire chain;
        # everything else needs only JS+essentials+<lang>.
        variant: [js, essentials, python, go, rust, java, kotlin, ruby, php, perl, swift, lean, rocq, full]
    # The guard below cancels this run when its commit is superseded, which
    # needs write access to the Actions API (issue #112 follow-up).
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # A queued matrix job can start long after the run was created, by which
      # time the pull request may have moved on (issue #112 follow-up). Check
      # before spending a runner on a commit nobody is waiting for.
      - name: Stop if a newer commit superseded this run
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bash scripts/ci/supersede.sh stop-if-superseded
          # ...and keep watching from inside the job. Cancelling from the
          # outside needs a free runner, and a superseded run holding every
          # slot is exactly why there is none.
          setsid nohup bash scripts/ci/supersede.sh watch \
            > "$RUNNER_TEMP/supersede-watch.log" 2>&1 < /dev/null &

      # A pull_request checkout is GitHub's merge preview, computed when the
      # pull request was last synchronised and never recomputed as main moves.
      # Merge the base branch first, so this job reports on what merging would
      # actually produce (issue #115, best practice #7).
      - name: Simulate a fresh merge with the base branch
        uses: ./.github/actions/simulate-fresh-merge

      - name: Free disk space
        uses: ./.github/actions/free-disk-space
        with:
          # Same reclaim as pr-test-full, and for the same reason: the
          # `full` variant of this matrix builds the identical chain - JS,
          # essentials, 11 language images, the full box - before it layers
          # dind on top, and it died the identical way in run 34259552358.
          # A matrix cannot vary a step's inputs per variant without an
          # expression, and there is nothing to gain by withholding the
          # reclaim from the 13 lighter variants, so all 14 get it (issue
          # #119 follow-up):
          #
          #   tool-cache  /opt/hostedtoolcache is ~8 GB of Python/Node/Go/Ruby
          #               builds for `actions/setup-*`. Nothing here calls one:
          #               these jobs run bash and docker, and the Node that
          #               `actions/checkout` needs lives in the runner's own
          #               externals directory, not in the tool cache.
          #   swap        removing it reclaims nothing on this image - there is
          #               no /mnt filesystem for /mnt/swapfile to be on (see the
          #               `df -a` in run 34259552358) - while `swapoff -a` still
          #               takes away every page of swap the kernel had. That is
          #               the wrong side of the trade for a job whose build was
          #               last seen being SIGKILLed.
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      # Same measurement, same fix as pr-test-full: the full box's export needs
      # more memory than this runner has, and the idle disk is the only place
      # left to get it (issue #119 follow-up). Gated on the variant because
      # `full` is the only one of the 14 that builds the full box; the other 13
      # would pay ~30 GB of disk for headroom they never touch.
      - name: Trade idle disk for swap the full-box export can grow into
        if: matrix.variant == 'full'
        run: bash scripts/ci/ensure-swap.sh

      # The budget is per matrix leg, because the cap is: `full` rebuilds the
      # whole chain inside a 90-minute job, the other 13 build one language at
      # most inside a 60-minute one, and a single worst-case number would either
      # be unreachable for the 13 or exceed 70% of their cap. 3000s against a
      # slowest-measured 2381s for `full`; 1350s against 1018s for rocq, the
      # slowest of the rest (docs/CI-TIMEOUT-BUDGETS.md).
      - name: Build base box for dind variant
        env:
          VARIANT: ${{ matrix.variant }}
          BUDGET_SECONDS: ${{ matrix.variant == 'full' && 3000 || 1350 }}
        run: |
          set -e
          # Keep sampling memory, disk and the biggest processes into this
          # step's own log. That is what turned the SIGKILL in run 34259552358
          # into a diagnosis in run 34278116323, and it is how the swap step
          # above gets checked: the export's committed memory should now cross
          # 16 GB and keep going instead of taking the runner down with it.
          bash scripts/ci/resource-monitor.sh &
          RESOURCE_MONITOR_PID=$!
          trap 'kill "$RESOURCE_MONITOR_PID" 2>/dev/null || true' EXIT

          bash scripts/ci/run-with-budget-warning.sh "$BUDGET_SECONDS" \
            "dind-${VARIANT} base chain build" \
            bash scripts/ci/build-chain.sh "$VARIANT"

          # scripts/ci/build-chain.sh always tags its result `box-<variant>`,
          # so the name needs no bookkeeping through the chain's branches.
          echo "BASE_IMAGE=box-${VARIANT}" >> "$GITHUB_ENV"

      - name: Build dind-box variant
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          bash scripts/ci/run-with-budget-warning.sh 300 "dind-${VARIANT} image build" \
            docker build -f ubuntu/24.04/dind/Dockerfile \
            --build-arg BASE_IMAGE="${BASE_IMAGE}" \
            -t "box-dind-${VARIANT}" .

      # A smoke test made of a dozen short `docker run` calls has no single
      # command to wrap, so it takes the budget GitHub can apply to a whole
      # step. It is a budget all the same, and counted as one by
      # scripts/ci/check-timeout-budgets.mjs.
      - name: Test dind-box variant
        timeout-minutes: 5
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -e
          IMG="box-dind-${VARIANT}"
          echo "=== Testing ${IMG} (no privileged mode in PR CI) ==="
          # Regression check for issue #88: docker exec and entrypoint-bypassed
          # shells use the image's configured USER, so dind variants must keep
          # Config.User aligned with the regular box images.
          CONFIG_USER=$(docker inspect --format '{{.Config.User}}' "$IMG")
          if [ "$CONFIG_USER" != "box" ]; then
            echo "Expected ${IMG} Config.User to be box, got '${CONFIG_USER:-<empty>}'"
            exit 1
          fi
          docker run --rm --entrypoint=/bin/bash "$IMG" -c 'test "$(whoami)" = box'
          docker run --rm --entrypoint=/bin/bash "$IMG" -c 'test "$HOME" = /home/box'
          docker run --rm --entrypoint=/bin/bash "$IMG" -c 'sudo -n /usr/bin/dockerd --version'

          # Verify Docker CLI, dockerd binary, buildx and compose plugins are present.
          # We do NOT start dockerd here because GitHub-hosted runners disallow --privileged.
          docker run --rm --entrypoint=/bin/bash "$IMG" -c 'docker --version'
          docker run --rm --entrypoint=/bin/bash "$IMG" -c 'dockerd --version'
          docker run --rm --entrypoint=/bin/bash "$IMG" -c 'docker buildx version'
          docker run --rm --entrypoint=/bin/bash "$IMG" -c 'docker compose version'
          docker run --rm --entrypoint=/bin/bash "$IMG" -c 'cat /etc/box/variant'
          echo "=== ${IMG} smoke tests passed ==="

      - name: Test documented dind examples
        if: matrix.variant == 'js'
        timeout-minutes: 3
        env:
          DIND_IMAGE: box-dind-js
          DIND_WAIT_SECONDS: "60"
        run: |
          set -e
          echo "=== Testing documented dind examples against ${DIND_IMAGE} ==="
          tests/dind/example-basic-docker-ps.sh
          tests/dind/example-commit-cycle.sh
          tests/dind/example-sudoers-extension.sh
          tests/dind/example-storage-driver-vfs.sh
          tests/dind/example-preload-images.sh
          tests/dind/example-dood-host-socket.sh
          echo "=== Documented dind examples passed ==="

  # --- Aggregator: single status check for branch protection ---
  # GitHub branch protection rules can require this one job to pass instead of
  # listing every parallel pr-test-* job individually.
  docker-build-test:
    name: docker-build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [pr-test-version-policy, pr-test-js, pr-test-essentials, pr-test-language, pr-test-full, pr-test-dind]
    if: |
      !cancelled() &&
      github.event_name == 'pull_request' &&
      fromJSON(inputs.changes)['should-build'] == 'true'
    steps:
      - name: Aggregate pr-test results
        run: |
          set -e
          echo "pr-test-version-policy: ${{ needs.pr-test-version-policy.result }}"
          echo "pr-test-js:         ${{ needs.pr-test-js.result }}"
          echo "pr-test-essentials: ${{ needs.pr-test-essentials.result }}"
          echo "pr-test-language:   ${{ needs.pr-test-language.result }}"
          echo "pr-test-full:       ${{ needs.pr-test-full.result }}"
          echo "pr-test-dind:       ${{ needs.pr-test-dind.result }}"

          fail=0
          for r in \
            "${{ needs.pr-test-version-policy.result }}" \
            "${{ needs.pr-test-js.result }}" \
            "${{ needs.pr-test-essentials.result }}" \
            "${{ needs.pr-test-language.result }}" \
            "${{ needs.pr-test-full.result }}" \
            "${{ needs.pr-test-dind.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) fail=1 ;;
            esac
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more pr-test jobs did not succeed."
            exit 1
          fi
          echo "All pr-test jobs succeeded."
