name: "Release: dind boxes"

# Called by .github/workflows/release.yml. It is not triggered directly: a
# `workflow_call` file has no other trigger, so it never starts a run of its own.
#
# Why it is a separate file (issue #115, RC-8). release.yml had grown to 3135
# lines - more than twice the 1500-line limit the reference CI/CD template
# enforces (scripts/check-file-line-limits.sh there, scripts/ci/check-file-line-limits.sh
# here). At that size a defect fixed in one of the near-identical build jobs kept
# surviving in the others, which is how RC-4 and RC-7 came back after being
# fixed. The file is split by image family; the job graph is unchanged.

on:
  workflow_call:
    inputs:
      changes:
        description: 'JSON object of the detect-changes job outputs'
        required: true
        type: string
      js-manifest-result:
        description: 'Result of the js-manifest job'
        required: false
        type: string
        default: ''
      essentials-manifest-result:
        description: 'Result of the essentials-manifest job'
        required: false
        type: string
        default: ''
      languages-manifest-result:
        description: 'Rollup result of the languages-manifest matrix'
        required: false
        type: string
        default: ''
      full-manifest-result:
        description: 'Result of the docker-manifest job'
        required: false
        type: string
        default: ''
    outputs:
      amd64-result:
        description: 'Rollup result of the build-dind-amd64 matrix'
        value: ${{ jobs.status.outputs.amd64-result }}
      arm64-result:
        description: 'Rollup result of the build-dind-arm64 matrix'
        value: ${{ jobs.status.outputs.arm64-result }}
      manifest-result:
        description: 'Rollup result of the dind-manifest matrix'
        value: ${{ jobs.status.outputs.manifest-result }}
    secrets:
      # Optional on purpose: Docker Hub is a mirror of GHCR, and every job that
      # uses these tolerates a failed login (issue #82). A fork or a repository
      # without the secrets set still publishes to GHCR.
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

# Workflow-level `env` is NOT inherited by a called workflow (each `workflow_call`
# file gets its own environment), so these five are re-declared here rather than
# read from release.yml. experiments/test-issue115-workflow-split.sh asserts that
# every release-*.yml carries the same set with the same values.
env:
  # actions/checkout's first act is `git init`, and a git with no configured
  # `init.defaultBranch` answers it with a thirteen-line advice block - "Using
  # 'master' as the name for the initial branch... this default branch name will
  # change" - at the top of every job log. 19 checkouts in the runs issue #121
  # lists printed 247 lines of it, in jobs where nothing was wrong. No step can
  # fix it, because it is printed before the first step of ours runs; git reads
  # configuration from the environment too, and the environment is there from
  # the start. Ported from the js template, which carries the same three lines
  # with the same reasoning.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  # The full-box Dockerfiles use `RUN --mount=type=bind,from=<stage>` to refresh
  # the copied rustup toolchains inside the same layer (issue #112). buildx
  # enables BuildKit implicitly; the plain `docker build` steps below need it
  # switched on explicitly or that syntax is a parse error.
  DOCKER_BUILDKIT: "1"
  # Keep the build's provenance out of the log (issue #121). buildx resolves
  # provenance for `--metadata-file` even when the attestation is switched off
  # (`provenance: false` on every build step here), docker/build-push-action
  # prints that metadata verbatim, and on the docker-container driver the
  # provenance carries `invocation.environment.github_event_payload` - the whole
  # push event, every commit message included. The runner matches the legacy
  # `##[command]` form *anywhere* in a line, so commit a2e6420, whose body
  # quotes `##[error]Process completed with exit code 143.` while explaining a
  # fix, put 56 failure annotations on build jobs that had every one succeeded
  # (release run 34293699247). `disabled` means buildx writes no provenance to
  # the metadata file, so there is nothing to print and nothing to misread.
  # experiments/test-issue121-log-injection.sh holds this in place.
  BUILDX_METADATA_PROVENANCE: disabled
  # GitHub Container Registry
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_NAME: ${{ github.repository }}
  # Docker Hub
  DOCKERHUB_REGISTRY: docker.io
  DOCKERHUB_IMAGE_NAME: konard/box

jobs:

  # === BUILD DIND-BOX VARIANTS (amd64) - issue #80 ===
  # Layers Docker Engine on top of every base box image so each variant has a
  # "<base>-dind" sibling. Runs after the source variant's manifest is published.
  build-dind-amd64:
    runs-on: ubuntu-24.04
    # Caps are sized from measured job durations, not guessed (issue #121,
    # docs/CI-TIMEOUT-BUDGETS.md): the `full` variant, the slowest of the 14, took 19.2 minutes - which is
    # 64% of the 30-minute cap this job used to carry, too close to leave. A cap far
    # above the work it bounds is the number of minutes a hung job burns
    # before anyone hears about it, and it is reported as a *cancelled* job
    # rather than a failed one.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # variant -> base box flavour. Special value "full" maps to konard/box.
        # Everything else maps to konard/box-<variant>.
        variant: [js, essentials, python, go, rust, java, kotlin, ruby, php, perl, swift, lean, rocq, full]
    if: |
      !cancelled() &&
      (inputs.js-manifest-result == 'success' || inputs.js-manifest-result == 'skipped') &&
      (inputs.essentials-manifest-result == 'success' || inputs.essentials-manifest-result == 'skipped') &&
      (inputs.languages-manifest-result == 'success' || inputs.languages-manifest-result == 'skipped') &&
      (inputs.full-manifest-result == 'success' || inputs.full-manifest-result == 'skipped') &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && fromJSON(inputs.changes)['should-build'] == 'true') ||
        (github.event_name == 'workflow_dispatch')
      )
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Nothing here pushes; leaving the token in .git/config would only
          # widen what a compromised step could reach.
          persist-credentials: false
          ref: main

      # Issue #82: free disk space on every build job's runner before pulling
      # base images / running buildx so that COPY --from=*-stage and large
      # apt installs never hit "no space left on device" mid-build.
      - name: Free disk space
        uses: ./.github/actions/free-disk-space
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Get latest version
        id: version
        run: |
          git pull origin main || true
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compute image names
        id: names
        run: |
          NAME="${{ matrix.variant }}"
          # Source base image: full -> "konard/box"; others -> "konard/box-<name>"
          # Target dind image: full -> "konard/box-dind"; others -> "konard/box-<name>-dind"
          if [ "$NAME" = "full" ]; then
            BASE_SUFFIX=""
            DIND_SUFFIX="-dind"
          else
            BASE_SUFFIX="-$NAME"
            DIND_SUFFIX="-${NAME}-dind"
          fi
          echo "base_image=${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}${BASE_SUFFIX}:${{ steps.version.outputs.version }}-amd64" >> "$GITHUB_OUTPUT"
          echo "dind_suffix=${DIND_SUFFIX}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx-resilient

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Issue #82: tolerate Docker Hub login failure (e.g. expired DOCKERHUB_TOKEN)
      # so that pushes to GHCR still proceed instead of taking down every build job.
      - name: Log in to Docker Hub
        id: dockerhub-login
        continue-on-error: true
        uses: ./.github/actions/dockerhub-login
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID == '' && secrets.DOCKERHUB_TOKEN || '' }}
          oidc-connection-id: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          oidc-organization: ${{ vars.DOCKERHUB_ORGANIZATION }}

      - name: "Check Docker Hub login (issue #82)"
        if: steps.dockerhub-login.outcome != 'success'
        run: |
          echo "::warning title=Docker Hub login failed::Docker Hub login failed (outcome=${{ steps.dockerhub-login.outcome }}). The DOCKERHUB_TOKEN repository secret is most likely expired or revoked. See docs/case-studies/issue-82/CASE-STUDY.md for the rotation runbook. The job will continue and push to GHCR; guarded Docker Hub publish steps will be skipped, while unguarded Docker Hub push attempts may fail without failing the job."

      # Issue #115 (RC-4): a manifest job that was skipped because its build
      # failed is indistinguishable, in an `if:` expression, from one skipped
      # because the flavour was not rebuilt. Assert the postcondition the gate
      # stands in for, so a missing base image is reported once, here, instead
      # of 28 matrix legs failing 8.5 minutes later blaming the dind Dockerfile.
      - name: Verify base image was published (issue #115)
        run: |
          bash scripts/release/assert-base-image.sh \
            "${{ steps.names.outputs.base_image }}" \
            "the ${{ matrix.variant }} dind-box (amd64) image"

      - name: Build and push ${{ matrix.variant }} dind-box (amd64)
        id: build-push
        continue-on-error: true
        # A `uses:` step cannot be routed through
        # scripts/ci/run-with-budget-warning.sh, so its budget is the one
        # GitHub applies to a whole step (issue #121,
        # docs/CI-TIMEOUT-BUDGETS.md). A step that runs out of it fails and
        # names itself; the job's `timeout-minutes` backstop would instead
        # report the whole job *cancelled*, with no indication of where the
        # time went. Sized from measurement: the slowest dind build (the
        # `full` variant) took 11.8 minutes.
        timeout-minutes: 20
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ubuntu/24.04/dind/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE=${{ steps.names.outputs.base_image }}
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}${{ steps.names.outputs.dind_suffix }}:latest-amd64
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}${{ steps.names.outputs.dind_suffix }}:${{ steps.version.outputs.version }}-amd64
          provenance: false
          cache-from: type=gha,scope=dind-${{ matrix.variant }}-amd64
          cache-to: type=gha,scope=dind-${{ matrix.variant }}-amd64,mode=max

      - name: Retry push ${{ matrix.variant }} dind-box (amd64) on failure
        if: steps.build-push.outcome == 'failure'
        run: |
          bash scripts/release/buildx-retry.sh \
              --file ubuntu/24.04/dind/Dockerfile \
              --platform linux/amd64 \
              --build-arg BASE_IMAGE=${{ steps.names.outputs.base_image }} \
              --tag ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}${{ steps.names.outputs.dind_suffix }}:latest-amd64 \
              --tag ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}${{ steps.names.outputs.dind_suffix }}:${{ steps.version.outputs.version }}-amd64 \
              --provenance=false \
              --cache-from type=gha,scope=dind-${{ matrix.variant }}-amd64 \
              --push \
              .

  # === BUILD DIND-BOX VARIANTS (arm64) - issue #80 ===
      # Issue #115 (RC-3): GHCR is the registry of record - it is written with
      # the per-run GITHUB_TOKEN, which cannot expire - and Docker Hub is a
      # mirror of it. Pushing both registries in one `docker buildx build --push`
      # meant a single expired DOCKERHUB_TOKEN destroyed the GHCR tags and the
      # `cache-to: type=gha` export as collateral (run 33972074755).
      - name: Mirror ${{ matrix.variant }} dind-box (amd64) to Docker Hub
        if: steps.dockerhub-login.outcome == 'success'
        run: |
          bash scripts/release/mirror-to-dockerhub.sh \
            "${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}${{ steps.names.outputs.dind_suffix }}:${{ steps.version.outputs.version }}-amd64" \
            "${{ env.DOCKERHUB_IMAGE_NAME }}${{ steps.names.outputs.dind_suffix }}:latest-amd64" \
            "${{ env.DOCKERHUB_IMAGE_NAME }}${{ steps.names.outputs.dind_suffix }}:${{ steps.version.outputs.version }}-amd64"

  build-dind-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [js, essentials, python, go, rust, java, kotlin, ruby, php, perl, swift, lean, rocq, full]
    if: |
      !cancelled() &&
      (inputs.js-manifest-result == 'success' || inputs.js-manifest-result == 'skipped') &&
      (inputs.essentials-manifest-result == 'success' || inputs.essentials-manifest-result == 'skipped') &&
      (inputs.languages-manifest-result == 'success' || inputs.languages-manifest-result == 'skipped') &&
      (inputs.full-manifest-result == 'success' || inputs.full-manifest-result == 'skipped') &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && fromJSON(inputs.changes)['should-build'] == 'true') ||
        (github.event_name == 'workflow_dispatch')
      )
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: main

      # Issue #82: free disk space on every build job's runner before pulling
      # base images / running buildx so that COPY --from=*-stage and large
      # apt installs never hit "no space left on device" mid-build.
      - name: Free disk space
        uses: ./.github/actions/free-disk-space
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Get latest version
        id: version
        run: |
          git pull origin main || true
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compute image names
        id: names
        run: |
          NAME="${{ matrix.variant }}"
          if [ "$NAME" = "full" ]; then
            BASE_SUFFIX=""
            DIND_SUFFIX="-dind"
          else
            BASE_SUFFIX="-$NAME"
            DIND_SUFFIX="-${NAME}-dind"
          fi
          echo "base_image=${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}${BASE_SUFFIX}:${{ steps.version.outputs.version }}-arm64" >> "$GITHUB_OUTPUT"
          echo "dind_suffix=${DIND_SUFFIX}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx-resilient

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Issue #82: tolerate Docker Hub login failure (e.g. expired DOCKERHUB_TOKEN)
      # so that pushes to GHCR still proceed instead of taking down every build job.
      - name: Log in to Docker Hub
        id: dockerhub-login
        continue-on-error: true
        uses: ./.github/actions/dockerhub-login
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID == '' && secrets.DOCKERHUB_TOKEN || '' }}
          oidc-connection-id: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          oidc-organization: ${{ vars.DOCKERHUB_ORGANIZATION }}

      - name: "Check Docker Hub login (issue #82)"
        if: steps.dockerhub-login.outcome != 'success'
        run: |
          echo "::warning title=Docker Hub login failed::Docker Hub login failed (outcome=${{ steps.dockerhub-login.outcome }}). The DOCKERHUB_TOKEN repository secret is most likely expired or revoked. See docs/case-studies/issue-82/CASE-STUDY.md for the rotation runbook. The job will continue and push to GHCR; guarded Docker Hub publish steps will be skipped, while unguarded Docker Hub push attempts may fail without failing the job."

      # Issue #115 (RC-4): a manifest job that was skipped because its build
      # failed is indistinguishable, in an `if:` expression, from one skipped
      # because the flavour was not rebuilt. Assert the postcondition the gate
      # stands in for, so a missing base image is reported once, here, instead
      # of 28 matrix legs failing 8.5 minutes later blaming the dind Dockerfile.
      - name: Verify base image was published (issue #115)
        run: |
          bash scripts/release/assert-base-image.sh \
            "${{ steps.names.outputs.base_image }}" \
            "the ${{ matrix.variant }} dind-box (arm64) image"

      - name: Build and push ${{ matrix.variant }} dind-box (arm64)
        id: build-push
        continue-on-error: true
        timeout-minutes: 20
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ubuntu/24.04/dind/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            BASE_IMAGE=${{ steps.names.outputs.base_image }}
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}${{ steps.names.outputs.dind_suffix }}:latest-arm64
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}${{ steps.names.outputs.dind_suffix }}:${{ steps.version.outputs.version }}-arm64
          provenance: false
          cache-from: type=gha,scope=dind-${{ matrix.variant }}-arm64
          cache-to: type=gha,scope=dind-${{ matrix.variant }}-arm64,mode=max

      - name: Retry push ${{ matrix.variant }} dind-box (arm64) on failure
        if: steps.build-push.outcome == 'failure'
        run: |
          bash scripts/release/buildx-retry.sh \
              --file ubuntu/24.04/dind/Dockerfile \
              --platform linux/arm64 \
              --build-arg BASE_IMAGE=${{ steps.names.outputs.base_image }} \
              --tag ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}${{ steps.names.outputs.dind_suffix }}:latest-arm64 \
              --tag ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}${{ steps.names.outputs.dind_suffix }}:${{ steps.version.outputs.version }}-arm64 \
              --provenance=false \
              --cache-from type=gha,scope=dind-${{ matrix.variant }}-arm64 \
              --push \
              .

  # === CREATE DIND-BOX MULTI-ARCH MANIFESTS - issue #80 ===
      # Issue #115 (RC-3): GHCR is the registry of record - it is written with
      # the per-run GITHUB_TOKEN, which cannot expire - and Docker Hub is a
      # mirror of it. Pushing both registries in one `docker buildx build --push`
      # meant a single expired DOCKERHUB_TOKEN destroyed the GHCR tags and the
      # `cache-to: type=gha` export as collateral (run 33972074755).
      - name: Mirror ${{ matrix.variant }} dind-box (arm64) to Docker Hub
        if: steps.dockerhub-login.outcome == 'success'
        run: |
          bash scripts/release/mirror-to-dockerhub.sh \
            "${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}${{ steps.names.outputs.dind_suffix }}:${{ steps.version.outputs.version }}-arm64" \
            "${{ env.DOCKERHUB_IMAGE_NAME }}${{ steps.names.outputs.dind_suffix }}:latest-arm64" \
            "${{ env.DOCKERHUB_IMAGE_NAME }}${{ steps.names.outputs.dind_suffix }}:${{ steps.version.outputs.version }}-arm64"

  dind-manifest:
    runs-on: ubuntu-24.04
    # Measured maximum 1.4 minutes: this job only assembles manifests.
    timeout-minutes: 10
    needs: [build-dind-amd64, build-dind-arm64]
    strategy:
      fail-fast: false
      matrix:
        variant: [js, essentials, python, go, rust, java, kotlin, ruby, php, perl, swift, lean, rocq, full]
    if: |
      !cancelled() &&
      needs.build-dind-amd64.result == 'success' &&
      needs.build-dind-arm64.result == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: main

      - name: Get latest version
        id: version
        run: |
          git pull origin main || true
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Issue #82: tolerate Docker Hub login failure (e.g. expired DOCKERHUB_TOKEN)
      # so that pushes to GHCR still proceed instead of taking down every build job.
      - name: Log in to Docker Hub
        id: dockerhub-login
        continue-on-error: true
        uses: ./.github/actions/dockerhub-login
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID == '' && secrets.DOCKERHUB_TOKEN || '' }}
          oidc-connection-id: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          oidc-organization: ${{ vars.DOCKERHUB_ORGANIZATION }}

      - name: "Check Docker Hub login (issue #82)"
        if: steps.dockerhub-login.outcome != 'success'
        run: |
          echo "::warning title=Docker Hub login failed::Docker Hub login failed (outcome=${{ steps.dockerhub-login.outcome }}). The DOCKERHUB_TOKEN repository secret is most likely expired or revoked. See docs/case-studies/issue-82/CASE-STUDY.md for the rotation runbook. The job will continue and push to GHCR; guarded Docker Hub publish steps will be skipped, while unguarded Docker Hub push attempts may fail without failing the job."

      - name: Compute dind suffix
        id: names
        run: |
          NAME="${{ matrix.variant }}"
          if [ "$NAME" = "full" ]; then
            echo "dind_suffix=-dind" >> "$GITHUB_OUTPUT"
          else
            echo "dind_suffix=-${NAME}-dind" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push ${{ matrix.variant }} dind multi-arch manifests (GHCR)
        run: |
          bash scripts/release/create-multiarch-manifest.sh \
            "${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}${{ steps.names.outputs.dind_suffix }}" \
            latest "${{ steps.version.outputs.version }}"

      # Copy the index GHCR now serves, rather than assembling a second one from
      # the mirrored per-architecture tags (issue #119a). Those tags are indexes
      # themselves - `docker buildx imagetools create` always writes one - and
      # `docker manifest create` refuses an index as a source, which is why
      # run 34056619231 retried "docker.io/***/box:2.7.0-amd64 is a manifest
      # list" three times and published nothing. There is also nothing to
      # assemble: the correct answer already exists on GHCR.
      - name: Mirror ${{ matrix.variant }} dind multi-arch manifests to Docker Hub
        if: steps.dockerhub-login.outcome == 'success'
        run: |
          bash scripts/release/mirror-to-dockerhub.sh \
            "${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}${{ steps.names.outputs.dind_suffix }}:${{ steps.version.outputs.version }}" \
            "${{ env.DOCKERHUB_IMAGE_NAME }}${{ steps.names.outputs.dind_suffix }}:latest" \
            "${{ env.DOCKERHUB_IMAGE_NAME }}${{ steps.names.outputs.dind_suffix }}:${{ steps.version.outputs.version }}"

      - name: Skip ${{ matrix.variant }} dind Docker Hub multi-arch manifests
        if: steps.dockerhub-login.outcome != 'success'
        run: |
          echo "::warning title=Docker Hub manifest skipped::Skipping the Docker Hub mirror of the ${{ matrix.variant }} dind multi-arch manifests because Docker Hub login outcome was ${{ steps.dockerhub-login.outcome }}. GHCR manifests were still published."

  # === STATUS ===
  #
  # The fifth release family had no status job and declared no `workflow_call`
  # outputs, while the other four exported theirs from `jobs.status.outputs.*`
  # (issue #121). Two spellings of one step is the shape of defect that produced
  # issue #119: the convention nobody wrote down is the one a later job picks
  # wrong. The run summary now carries a dind table like every other family, and
  # the results are readable by the caller.
  #
  # This job summarises; it does not gate. The gate is `pipeline-status` in
  # release.yml, which needs `dind` along with every other job there. Keeping
  # the two apart is deliberate: a reusable workflow's declared outputs come
  # from a job that has to be allowed to complete, so the job that reports the
  # results must not be the job that fails on them.
  status:
    name: dind / status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [build-dind-amd64, build-dind-arm64, dind-manifest]
    if: ${{ !cancelled() }}
    outputs:
      amd64-result: ${{ needs.build-dind-amd64.result }}
      arm64-result: ${{ needs.build-dind-arm64.result }}
      manifest-result: ${{ needs.dind-manifest.result }}
    steps:
      - name: Summarise
        run: |
          {
            echo "### dind / status"
            echo ""
            echo "| job | result |"
            echo "| --- | --- |"
            echo "| build-dind-amd64 | ${{ needs.build-dind-amd64.result }} |"
            echo "| build-dind-arm64 | ${{ needs.build-dind-arm64.result }} |"
            echo "| dind-manifest | ${{ needs.dind-manifest.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
