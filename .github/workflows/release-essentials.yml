name: "Release: essentials box"

# Called by .github/workflows/release.yml. It is not triggered directly: a
# `workflow_call` file has no other trigger, so it never starts a run of its own.
#
# Why it is a separate file (issue #115, RC-8). release.yml had grown to 3135
# lines - more than twice the 1500-line limit the reference CI/CD template
# enforces (scripts/check-file-line-limits.sh there, scripts/ci/check-file-line-limits.sh
# here). At that size a defect fixed in one of the near-identical build jobs kept
# surviving in the others, which is how RC-4 and RC-7 came back after being
# fixed. The file is split by image family; the job graph is unchanged.

on:
  workflow_call:
    inputs:
      changes:
        description: 'JSON object of the detect-changes job outputs'
        required: true
        type: string
      js-built-amd64:
        description: 'release-js.yml built-amd64 output'
        required: false
        type: string
        default: ''
      js-built-arm64:
        description: 'release-js.yml built-arm64 output'
        required: false
        type: string
        default: ''
      js-amd64-result:
        description: 'Result of the build-js-amd64 job'
        required: false
        type: string
        default: ''
      js-arm64-result:
        description: 'Result of the build-js-arm64 job'
        required: false
        type: string
        default: ''
    outputs:
      built-amd64:
        description: 'true when build-essentials-amd64 pushed a fresh image'
        value: ${{ jobs.status.outputs.built-amd64 }}
      built-arm64:
        description: 'true when build-essentials-arm64 pushed a fresh image'
        value: ${{ jobs.status.outputs.built-arm64 }}
      amd64-result:
        description: 'Result of build-essentials-amd64'
        value: ${{ jobs.status.outputs.amd64-result }}
      arm64-result:
        description: 'Result of build-essentials-arm64'
        value: ${{ jobs.status.outputs.arm64-result }}
      manifest-result:
        description: 'Result of essentials-manifest'
        value: ${{ jobs.status.outputs.manifest-result }}
    secrets:
      # Optional on purpose: Docker Hub is a mirror of GHCR, and every job that
      # uses these tolerates a failed login (issue #82). A fork or a repository
      # without the secrets set still publishes to GHCR.
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

# Workflow-level `env` is NOT inherited by a called workflow (each `workflow_call`
# file gets its own environment), so these five are re-declared here rather than
# read from release.yml. experiments/test-issue115-workflow-split.sh asserts that
# every release-*.yml carries the same set with the same values.
env:
  # The full-box Dockerfiles use `RUN --mount=type=bind,from=<stage>` to refresh
  # the copied rustup toolchains inside the same layer (issue #112). buildx
  # enables BuildKit implicitly; the plain `docker build` steps below need it
  # switched on explicitly or that syntax is a parse error.
  DOCKER_BUILDKIT: "1"
  # GitHub Container Registry
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_NAME: ${{ github.repository }}
  # Docker Hub
  DOCKERHUB_REGISTRY: docker.io
  DOCKERHUB_IMAGE_NAME: konard/box

jobs:

  # === BUILD ESSENTIALS BOX (amd64) ===
  # Built on top of JS box - waits for JS to complete (if JS was rebuilt)
  build-essentials-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    if: |
      !cancelled() &&
      (inputs.js-amd64-result == 'success' || inputs.js-amd64-result == 'skipped') &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && fromJSON(inputs.changes)['should-build'] == 'true') ||
        (github.event_name == 'workflow_dispatch')
      ) &&
      (
        fromJSON(inputs.changes)['js-changed'] == 'true' ||
        fromJSON(inputs.changes)['essentials-changed'] == 'true' ||
        fromJSON(inputs.changes)['common-changed'] == 'true' ||
        fromJSON(inputs.changes)['scripts-changed'] == 'true' ||
        fromJSON(inputs.changes)['version-changed'] == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    permissions:
      contents: read
      packages: write
    outputs:
      built: ${{ steps.result.outputs.built }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      # Issue #82: free disk space on every build job's runner before pulling
      # base images / running buildx so that COPY --from=*-stage and large
      # apt installs never hit "no space left on device" mid-build.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Get latest version
        id: version
        run: |
          git pull origin main || true
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx-resilient

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Issue #82: tolerate Docker Hub login failure (e.g. expired DOCKERHUB_TOKEN)
      # so that pushes to GHCR still proceed instead of taking down every build job.
      - name: Log in to Docker Hub
        id: dockerhub-login
        continue-on-error: true
        uses: ./.github/actions/dockerhub-login
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID == '' && secrets.DOCKERHUB_TOKEN || '' }}
          oidc-connection-id: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          oidc-organization: ${{ vars.DOCKERHUB_ORGANIZATION }}

      - name: "Check Docker Hub login (issue #82)"
        if: steps.dockerhub-login.outcome != 'success'
        run: |
          echo "::warning title=Docker Hub login failed::Docker Hub login failed (outcome=${{ steps.dockerhub-login.outcome }}). The DOCKERHUB_TOKEN repository secret is most likely expired or revoked. See docs/case-studies/issue-82/CASE-STUDY.md for the rotation runbook. The job will continue and push to GHCR; guarded Docker Hub publish steps will be skipped, while unguarded Docker Hub push attempts may fail without failing the job."

      - name: Determine JS base image
        id: js-base
        env:
          UPSTREAM_BUILT: ${{ inputs.js-built-amd64 }}
        run: |
          # Use freshly built JS image if JS was rebuilt, otherwise use latest
          if [ "$UPSTREAM_BUILT" = "true" ]; then
            echo "image=${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}-js:${{ steps.version.outputs.version }}-amd64" >> "$GITHUB_OUTPUT"
          else
            echo "image=${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}-js:latest-amd64" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push essentials box (amd64)
        id: build-push
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ubuntu/24.04/essentials-box/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            JS_IMAGE=${{ steps.js-base.outputs.image }}
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}-essentials:latest-amd64
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}-essentials:${{ steps.version.outputs.version }}-amd64
          provenance: false
          cache-from: type=gha,scope=essentials-amd64
          cache-to: type=gha,scope=essentials-amd64,mode=max

      # Retry push on transient GHCR 403 errors (Issue #78)
      - name: Retry push essentials box (amd64) on failure
        if: steps.build-push.outcome == 'failure'
        run: |
          bash scripts/release/buildx-retry.sh \
              --file ubuntu/24.04/essentials-box/Dockerfile \
              --platform linux/amd64 \
              --build-arg JS_IMAGE=${{ steps.js-base.outputs.image }} \
              --tag ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}-essentials:latest-amd64 \
              --tag ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}-essentials:${{ steps.version.outputs.version }}-amd64 \
              --provenance=false \
              --cache-from type=gha,scope=essentials-amd64 \
              --push \
              .

      # Issue #115 (RC-3): GHCR is the registry of record - it is written with
      # the per-run GITHUB_TOKEN, which cannot expire - and Docker Hub is a
      # mirror of it. Pushing both registries in one `docker buildx build --push`
      # meant a single expired DOCKERHUB_TOKEN destroyed the GHCR tags and the
      # `cache-to: type=gha` export as collateral (run 33972074755).
      - name: Mirror essentials box (amd64) to Docker Hub
        if: steps.dockerhub-login.outcome == 'success'
        run: |
          bash scripts/release/mirror-to-dockerhub.sh \
            "${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}-essentials:${{ steps.version.outputs.version }}-amd64" \
            "${{ env.DOCKERHUB_IMAGE_NAME }}-essentials:latest-amd64" \
            "${{ env.DOCKERHUB_IMAGE_NAME }}-essentials:${{ steps.version.outputs.version }}-amd64"

      - name: Mark as built
        id: result
        run: echo "built=true" >> "$GITHUB_OUTPUT"

  # === BUILD ESSENTIALS BOX (arm64) ===
  build-essentials-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    if: |
      !cancelled() &&
      (inputs.js-arm64-result == 'success' || inputs.js-arm64-result == 'skipped') &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && fromJSON(inputs.changes)['should-build'] == 'true') ||
        (github.event_name == 'workflow_dispatch')
      ) &&
      (
        fromJSON(inputs.changes)['js-changed'] == 'true' ||
        fromJSON(inputs.changes)['essentials-changed'] == 'true' ||
        fromJSON(inputs.changes)['common-changed'] == 'true' ||
        fromJSON(inputs.changes)['scripts-changed'] == 'true' ||
        fromJSON(inputs.changes)['version-changed'] == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    permissions:
      contents: read
      packages: write
    outputs:
      built: ${{ steps.result.outputs.built }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      # Issue #82: free disk space on every build job's runner before pulling
      # base images / running buildx so that COPY --from=*-stage and large
      # apt installs never hit "no space left on device" mid-build.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Get latest version
        id: version
        run: |
          git pull origin main || true
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx-resilient

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Issue #82: tolerate Docker Hub login failure (e.g. expired DOCKERHUB_TOKEN)
      # so that pushes to GHCR still proceed instead of taking down every build job.
      - name: Log in to Docker Hub
        id: dockerhub-login
        continue-on-error: true
        uses: ./.github/actions/dockerhub-login
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID == '' && secrets.DOCKERHUB_TOKEN || '' }}
          oidc-connection-id: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          oidc-organization: ${{ vars.DOCKERHUB_ORGANIZATION }}

      - name: "Check Docker Hub login (issue #82)"
        if: steps.dockerhub-login.outcome != 'success'
        run: |
          echo "::warning title=Docker Hub login failed::Docker Hub login failed (outcome=${{ steps.dockerhub-login.outcome }}). The DOCKERHUB_TOKEN repository secret is most likely expired or revoked. See docs/case-studies/issue-82/CASE-STUDY.md for the rotation runbook. The job will continue and push to GHCR; guarded Docker Hub publish steps will be skipped, while unguarded Docker Hub push attempts may fail without failing the job."

      - name: Determine JS base image
        id: js-base
        env:
          UPSTREAM_BUILT: ${{ inputs.js-built-arm64 }}
        run: |
          if [ "$UPSTREAM_BUILT" = "true" ]; then
            echo "image=${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}-js:${{ steps.version.outputs.version }}-arm64" >> "$GITHUB_OUTPUT"
          else
            echo "image=${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}-js:latest-arm64" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push essentials box (arm64)
        id: build-push
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ubuntu/24.04/essentials-box/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            JS_IMAGE=${{ steps.js-base.outputs.image }}
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}-essentials:latest-arm64
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}-essentials:${{ steps.version.outputs.version }}-arm64
          provenance: false
          cache-from: type=gha,scope=essentials-arm64
          cache-to: type=gha,scope=essentials-arm64,mode=max

      # Retry push on transient GHCR 403 errors (Issue #78)
      - name: Retry push essentials box (arm64) on failure
        if: steps.build-push.outcome == 'failure'
        run: |
          bash scripts/release/buildx-retry.sh \
              --file ubuntu/24.04/essentials-box/Dockerfile \
              --platform linux/arm64 \
              --build-arg JS_IMAGE=${{ steps.js-base.outputs.image }} \
              --tag ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}-essentials:latest-arm64 \
              --tag ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}-essentials:${{ steps.version.outputs.version }}-arm64 \
              --provenance=false \
              --cache-from type=gha,scope=essentials-arm64 \
              --push \
              .

      # Issue #115 (RC-3): GHCR is the registry of record - it is written with
      # the per-run GITHUB_TOKEN, which cannot expire - and Docker Hub is a
      # mirror of it. Pushing both registries in one `docker buildx build --push`
      # meant a single expired DOCKERHUB_TOKEN destroyed the GHCR tags and the
      # `cache-to: type=gha` export as collateral (run 33972074755).
      - name: Mirror essentials box (arm64) to Docker Hub
        if: steps.dockerhub-login.outcome == 'success'
        run: |
          bash scripts/release/mirror-to-dockerhub.sh \
            "${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}-essentials:${{ steps.version.outputs.version }}-arm64" \
            "${{ env.DOCKERHUB_IMAGE_NAME }}-essentials:latest-arm64" \
            "${{ env.DOCKERHUB_IMAGE_NAME }}-essentials:${{ steps.version.outputs.version }}-arm64"

      - name: Mark as built
        id: result
        run: echo "built=true" >> "$GITHUB_OUTPUT"

  # === CREATE ESSENTIALS MULTI-ARCH MANIFEST ===
  essentials-manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [build-essentials-amd64, build-essentials-arm64]
    if: |
      !cancelled() &&
      needs.build-essentials-amd64.result == 'success' &&
      needs.build-essentials-arm64.result == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Get latest version
        id: version
        run: |
          git pull origin main || true
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Issue #82: tolerate Docker Hub login failure (e.g. expired DOCKERHUB_TOKEN)
      # so that pushes to GHCR still proceed instead of taking down every build job.
      - name: Log in to Docker Hub
        id: dockerhub-login
        continue-on-error: true
        uses: ./.github/actions/dockerhub-login
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID == '' && secrets.DOCKERHUB_TOKEN || '' }}
          oidc-connection-id: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          oidc-organization: ${{ vars.DOCKERHUB_ORGANIZATION }}

      - name: "Check Docker Hub login (issue #82)"
        if: steps.dockerhub-login.outcome != 'success'
        run: |
          echo "::warning title=Docker Hub login failed::Docker Hub login failed (outcome=${{ steps.dockerhub-login.outcome }}). The DOCKERHUB_TOKEN repository secret is most likely expired or revoked. See docs/case-studies/issue-82/CASE-STUDY.md for the rotation runbook. The job will continue and push to GHCR; guarded Docker Hub publish steps will be skipped, while unguarded Docker Hub push attempts may fail without failing the job."

      - name: Create and push essentials multi-arch manifests (GHCR)
        run: |
          bash scripts/release/create-multiarch-manifest.sh \
            "${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}-essentials" \
            latest "${{ steps.version.outputs.version }}"

      - name: Create and push essentials multi-arch manifests (Docker Hub)
        if: steps.dockerhub-login.outcome == 'success'
        env:
          # A Docker Hub manifest failure must not fail a release whose GHCR
          # manifest is already published (issue #115, RC-3).
          MANIFEST_REQUIRED: '0'
        run: |
          bash scripts/release/create-multiarch-manifest.sh \
            "${{ env.DOCKERHUB_IMAGE_NAME }}-essentials" \
            latest "${{ steps.version.outputs.version }}"

      - name: Skip essentials Docker Hub multi-arch manifests
        if: steps.dockerhub-login.outcome != 'success'
        run: |
          echo "::warning title=Docker Hub manifest skipped::Skipping essentials Docker Hub multi-arch manifests because Docker Hub login outcome was ${{ steps.dockerhub-login.outcome }}. GHCR manifests were still published."

  # === STATUS ===
  #
  # `needs.<job>.result` cannot leave a called workflow: only `jobs.<id>.outputs`
  # can. Before the split, the essentials jobs read those results directly; this job
  # copies them into workflow outputs so the caller can hand them to the next
  # family and the per-job conditions stay exactly what they were (issue #115).
  # `build-essentials-amd64`, `build-essentials-arm64`, `essentials-manifest` includes matrix jobs, whose rollup result is what the
  # conditions were written against - a per-leg step output could not reproduce it.
  status:
    name: essentials / status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [build-essentials-amd64, build-essentials-arm64, essentials-manifest]
    if: ${{ !cancelled() }}
    outputs:
      built-amd64: ${{ needs.build-essentials-amd64.outputs.built }}
      built-arm64: ${{ needs.build-essentials-arm64.outputs.built }}
      amd64-result: ${{ needs.build-essentials-amd64.result }}
      arm64-result: ${{ needs.build-essentials-arm64.result }}
      manifest-result: ${{ needs.essentials-manifest.result }}
    steps:
      - name: Summarise
        run: |
          {
            echo "### essentials / status"
            echo ""
            echo "| job | result |"
            echo "| --- | --- |"
            echo "| build-essentials-amd64 | ${{ needs.build-essentials-amd64.result }} |"
            echo "| build-essentials-arm64 | ${{ needs.build-essentials-arm64.result }} |"
            echo "| essentials-manifest | ${{ needs.essentials-manifest.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
