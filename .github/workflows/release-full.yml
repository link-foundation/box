name: "Release: full box"

# Called by .github/workflows/release.yml. It is not triggered directly: a
# `workflow_call` file has no other trigger, so it never starts a run of its own.
#
# Why it is a separate file (issue #115, RC-8). release.yml had grown to 3135
# lines - more than twice the 1500-line limit the reference CI/CD template
# enforces (scripts/check-file-line-limits.sh there, scripts/ci/check-file-line-limits.sh
# here). At that size a defect fixed in one of the near-identical build jobs kept
# surviving in the others, which is how RC-4 and RC-7 came back after being
# fixed. The file is split by image family; the job graph is unchanged.

on:
  workflow_call:
    inputs:
      changes:
        description: 'JSON object of the detect-changes job outputs'
        required: true
        type: string
      essentials-built-amd64:
        description: 'release-essentials.yml built-amd64 output'
        required: false
        type: string
        default: ''
      essentials-built-arm64:
        description: 'release-essentials.yml built-arm64 output'
        required: false
        type: string
        default: ''
      essentials-amd64-result:
        description: 'Result of the build-essentials-amd64 job'
        required: false
        type: string
        default: ''
      essentials-arm64-result:
        description: 'Result of the build-essentials-arm64 job'
        required: false
        type: string
        default: ''
      languages-amd64-result:
        description: 'Rollup result of the build-languages-amd64 matrix'
        required: false
        type: string
        default: ''
      languages-arm64-result:
        description: 'Rollup result of the build-languages-arm64 matrix'
        required: false
        type: string
        default: ''
    outputs:
      amd64-result:
        description: 'Result of docker-build-push'
        value: ${{ jobs.status.outputs.amd64-result }}
      arm64-result:
        description: 'Result of docker-build-push-arm64'
        value: ${{ jobs.status.outputs.arm64-result }}
      manifest-result:
        description: 'Result of docker-manifest'
        value: ${{ jobs.status.outputs.manifest-result }}
    secrets:
      # Optional on purpose: Docker Hub is a mirror of GHCR, and every job that
      # uses these tolerates a failed login (issue #82). A fork or a repository
      # without the secrets set still publishes to GHCR.
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

# Workflow-level `env` is NOT inherited by a called workflow (each `workflow_call`
# file gets its own environment), so these five are re-declared here rather than
# read from release.yml. experiments/test-issue115-workflow-split.sh asserts that
# every release-*.yml carries the same set with the same values.
env:
  # actions/checkout's first act is `git init`, and a git with no configured
  # `init.defaultBranch` answers it with a thirteen-line advice block - "Using
  # 'master' as the name for the initial branch... this default branch name will
  # change" - at the top of every job log. 19 checkouts in the runs issue #121
  # lists printed 247 lines of it, in jobs where nothing was wrong. No step can
  # fix it, because it is printed before the first step of ours runs; git reads
  # configuration from the environment too, and the environment is there from
  # the start. Ported from the js template, which carries the same three lines
  # with the same reasoning.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  # The full-box Dockerfiles use `RUN --mount=type=bind,from=<stage>` to refresh
  # the copied rustup toolchains inside the same layer (issue #112). buildx
  # enables BuildKit implicitly; the plain `docker build` steps below need it
  # switched on explicitly or that syntax is a parse error.
  DOCKER_BUILDKIT: "1"
  # Keep the build's provenance out of the log (issue #121). buildx resolves
  # provenance for `--metadata-file` even when the attestation is switched off
  # (`provenance: false` on every build step here), docker/build-push-action
  # prints that metadata verbatim, and on the docker-container driver the
  # provenance carries `invocation.environment.github_event_payload` - the whole
  # push event, every commit message included. The runner matches the legacy
  # `##[command]` form *anywhere* in a line, so commit a2e6420, whose body
  # quotes `##[error]Process completed with exit code 143.` while explaining a
  # fix, put 56 failure annotations on build jobs that had every one succeeded
  # (release run 34293699247). `disabled` means buildx writes no provenance to
  # the metadata file, so there is nothing to print and nothing to misread.
  # experiments/test-issue121-log-injection.sh holds this in place.
  BUILDX_METADATA_PROVENANCE: disabled
  # GitHub Container Registry
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_NAME: ${{ github.repository }}
  # Docker Hub
  DOCKERHUB_REGISTRY: docker.io
  DOCKERHUB_IMAGE_NAME: konard/box

jobs:

  # === BUILD AND PUSH FULL BOX (MAIN - amd64) ===
  docker-build-push:
    runs-on: ubuntu-24.04
    # Caps are sized from measured job durations, not guessed (issue #121,
    # docs/CI-TIMEOUT-BUDGETS.md): this job's slowest run of the last 300 took 35.6 minutes. A cap far
    # above the work it bounds is the number of minutes a hung job burns
    # before anyone hears about it, and it is reported as a *cancelled* job
    # rather than a failed one.
    timeout-minutes: 90
    # Run on push to main with changes, OR on workflow_dispatch
    if: |
      !cancelled() &&
      (inputs.essentials-amd64-result == 'success' || inputs.essentials-amd64-result == 'skipped') &&
      (inputs.languages-amd64-result == 'success' || inputs.languages-amd64-result == 'skipped') &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && fromJSON(inputs.changes)['should-build'] == 'true') ||
        (github.event_name == 'workflow_dispatch')
      )
    permissions:
      contents: read
      packages: write

    outputs:
      version: ${{ fromJSON(inputs.changes)['version'] }}
      digest: ${{ steps.build.outputs.digest }}
      # The tag list every later job writes or combines (issue #119b).
      tags: ${{ steps.tags.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Nothing here pushes; leaving the token in .git/config would only
          # widen what a compromised step could reach.
          persist-credentials: false
          ref: main  # Always use latest main for releases

      # Fix for issue #41: Free disk space to prevent "No space left on device" errors
      # This step removes unnecessary pre-installed software from the runner to free ~30 GB
      # See: docs/case-studies/issue-41/CASE-STUDY.md
      - name: Free disk space
        uses: ./.github/actions/free-disk-space
        with:
          tool-cache: false  # Keep tool cache for setup-* action compatibility
          android: true      # Free ~14 GB
          dotnet: true       # Free ~2.7 GB
          haskell: true      # Free ~0 GB (not pre-installed on ubuntu-24.04)
          large-packages: true  # Free ~5.3 GB
          docker-images: true   # Clean existing Docker images
          swap-storage: true    # Free ~4 GB

      # One release, one version (issue #123): the pipeline computed it once in
      # release.yml's detect-changes job and handed it over inside `changes`.
      # See scripts/release/release-version.sh for what this replaced and why.
      - name: Get latest version
        id: version
        env:
          PIPELINE_VERSION: ${{ fromJSON(inputs.changes)['version'] }}
        run: bash scripts/release/release-version.sh

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx-resilient

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Issue #82: tolerate Docker Hub login failure (e.g. expired DOCKERHUB_TOKEN)
      # so that pushes to GHCR still proceed instead of taking down every build job.
      - name: Log in to Docker Hub
        id: dockerhub-login
        continue-on-error: true
        uses: ./.github/actions/dockerhub-login
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID == '' && secrets.DOCKERHUB_TOKEN || '' }}
          oidc-connection-id: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          oidc-organization: ${{ vars.DOCKERHUB_ORGANIZATION }}

      - name: "Check Docker Hub login (issue #82)"
        if: steps.dockerhub-login.outcome != 'success'
        run: |
          echo "::warning title=Docker Hub login failed::Docker Hub login failed (outcome=${{ steps.dockerhub-login.outcome }}). The DOCKERHUB_TOKEN repository secret is most likely expired or revoked. See docs/case-studies/issue-82/CASE-STUDY.md for the rotation runbook. The job will continue and push to GHCR; guarded Docker Hub publish steps will be skipped, while unguarded Docker Hub push attempts may fail without failing the job."

      - name: Determine base images
        id: base-images
        env:
          UPSTREAM_BUILT: ${{ inputs.essentials-built-amd64 }}
          LANGUAGES_RESULT: ${{ inputs.languages-amd64-result }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Essentials base image
          if [ "$UPSTREAM_BUILT" = "true" ]; then
            echo "essentials=${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}-essentials:${VERSION}-amd64" >> "$GITHUB_OUTPUT"
          else
            echo "essentials=${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}-essentials:latest-amd64" >> "$GITHUB_OUTPUT"
          fi

          # Language images - use version tag if languages were built, otherwise latest
          for lang in python go rust java kotlin ruby php perl swift lean rocq; do
            # If the language matrix ran successfully, use versioned tag
            if [ "$LANGUAGES_RESULT" = "success" ]; then
              echo "${lang}=${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}-${lang}:${VERSION}-amd64" >> "$GITHUB_OUTPUT"
            else
              echo "${lang}=${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}-${lang}:latest-amd64" >> "$GITHUB_OUTPUT"
            fi
          done

      # Labels only. The tags come from the step below, because a tag list is
      # a property of the release and metadata-action computes one per job.
      - name: Extract metadata (labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}

      # Issue #119b. This job used to push the unsuffixed tags - latest, the
      # version, the date and the commit - alongside its own -amd64 ones, and
      # then mirror all eight to Docker Hub. So `box:latest` was whatever the
      # amd64 job wrote until the manifest step overwrote it, and the two tags
      # the manifest step did not know about were never overwritten at all.
      # Measured anonymously on 2026-09-08:
      #
      #   ghcr.io/link-foundation/box:2.7.0     linux/amd64 linux/arm64
      #   ghcr.io/link-foundation/box:20260907  linux/amd64
      #   ghcr.io/link-foundation/box:fd4742b   linux/amd64
      #
      # Now this job writes -amd64 tags only, and the list is computed once,
      # here, and handed to the arm64 build and the manifest job: metadata-action
      # evaluates `{{date 'YYYYMMDD'}}` when the step runs, and the full box
      # takes over an hour to build, so a release started before midnight UTC
      # gave the two builds different date tags.
      - name: Compute the tags this release publishes
        id: tags
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          IMAGE_TAGS_DATE="$(date -u +%Y%m%d)"
          export IMAGE_TAGS_DATE

          TAGS="$(bash scripts/release/image-tags.sh | tr '\n' ' ')"
          echo "tags=${TAGS% }" >> "$GITHUB_OUTPUT"
          {
            echo "refs<<TAGS_EOF"
            bash scripts/release/image-tags.sh \
              --image "${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}" --suffix -amd64
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push full box (amd64)
        id: build
        continue-on-error: true
        # A `uses:` step cannot be routed through
        # scripts/ci/run-with-budget-warning.sh, so its budget is the one
        # GitHub applies to a whole step (issue #121,
        # docs/CI-TIMEOUT-BUDGETS.md). A step that runs out of it fails and
        # names itself; the job's `timeout-minutes` backstop would instead
        # report the whole job *cancelled*, with no indication of where the
        # time went. Sized from measurement: the slowest full-box build over
        # the last 200 runs took 20.7 minutes.
        timeout-minutes: 40
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ubuntu/24.04/full-box/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            ESSENTIALS_IMAGE=${{ steps.base-images.outputs.essentials }}
            PYTHON_IMAGE=${{ steps.base-images.outputs.python }}
            GO_IMAGE=${{ steps.base-images.outputs.go }}
            RUST_IMAGE=${{ steps.base-images.outputs.rust }}
            JAVA_IMAGE=${{ steps.base-images.outputs.java }}
            KOTLIN_IMAGE=${{ steps.base-images.outputs.kotlin }}
            RUBY_IMAGE=${{ steps.base-images.outputs.ruby }}
            PHP_IMAGE=${{ steps.base-images.outputs.php }}
            PERL_IMAGE=${{ steps.base-images.outputs.perl }}
            SWIFT_IMAGE=${{ steps.base-images.outputs.swift }}
            LEAN_IMAGE=${{ steps.base-images.outputs.lean }}
            ROCQ_IMAGE=${{ steps.base-images.outputs.rocq }}
          tags: ${{ steps.tags.outputs.refs }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false  # Prevents unknown/unknown platform in registry
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Retry push on transient GHCR 403 errors (Issue #78)
      - name: Retry push full box (amd64) on failure
        if: steps.build.outcome == 'failure'
        env:
          ALL_TAGS: ${{ steps.tags.outputs.refs }}
        run: |
          TAG_ARGS=()
          while IFS= read -r tag; do
            tag=$(echo "$tag" | xargs)
            [ -z "$tag" ] && continue
            TAG_ARGS+=(--tag "$tag")
          done <<< "$ALL_TAGS"
          bash scripts/release/buildx-retry.sh \
              --file ubuntu/24.04/full-box/Dockerfile \
              --platform linux/amd64 \
              --build-arg ESSENTIALS_IMAGE=${{ steps.base-images.outputs.essentials }} \
              --build-arg PYTHON_IMAGE=${{ steps.base-images.outputs.python }} \
              --build-arg GO_IMAGE=${{ steps.base-images.outputs.go }} \
              --build-arg RUST_IMAGE=${{ steps.base-images.outputs.rust }} \
              --build-arg JAVA_IMAGE=${{ steps.base-images.outputs.java }} \
              --build-arg KOTLIN_IMAGE=${{ steps.base-images.outputs.kotlin }} \
              --build-arg RUBY_IMAGE=${{ steps.base-images.outputs.ruby }} \
              --build-arg PHP_IMAGE=${{ steps.base-images.outputs.php }} \
              --build-arg PERL_IMAGE=${{ steps.base-images.outputs.perl }} \
              --build-arg SWIFT_IMAGE=${{ steps.base-images.outputs.swift }} \
              --build-arg LEAN_IMAGE=${{ steps.base-images.outputs.lean }} \
              --build-arg ROCQ_IMAGE=${{ steps.base-images.outputs.rocq }} \
              "${TAG_ARGS[@]}" \
              --provenance=false \
              --cache-from type=gha \
              --push \
              .

      # Smoke test the published image to verify all toolchains work (issue #62)
      # Tests each toolchain command to catch cases where tools are missing/broken
      # Issue #115 (RC-3): GHCR is the registry of record - it is written with
      # the per-run GITHUB_TOKEN, which cannot expire - and Docker Hub is a
      # mirror of it. docker/metadata-action now emits GHCR names only, so the
      # Docker Hub names are derived from them by rewriting the registry prefix.
      - name: Mirror full box (amd64) to Docker Hub
        if: steps.dockerhub-login.outcome == 'success'
        env:
          GHCR_TAGS: ${{ steps.tags.outputs.refs }}
        run: |
          GHCR_PREFIX="${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}"
          DH_PREFIX="${{ env.DOCKERHUB_IMAGE_NAME }}"
          SOURCE="${GHCR_PREFIX}:${{ steps.version.outputs.version }}-amd64"

          TARGETS=()
          while IFS= read -r tag; do
            tag=$(echo "$tag" | xargs)
            [ -z "$tag" ] && continue
            suffix="${tag#"$GHCR_PREFIX"}"
            # A name the prefix rewrite does not apply to is not ours to mirror.
            [ "$suffix" = "$tag" ] && continue
            TARGETS+=("${DH_PREFIX}${suffix}")
          done <<< "$GHCR_TAGS"

          bash scripts/release/mirror-to-dockerhub.sh "$SOURCE" "${TARGETS[@]}"

      # Issue #115: the same script as the pre-merge full-box test, so the
      # pushed artifact is verified by exactly the checks its candidate passed.
      # This step used to be a hand-maintained copy that had drifted to a
      # 22-of-29 subset.
      # The architecture this job built, by the name this job pushed it under.
      # The unsuffixed tag is written by the manifest job, which has not run yet
      # (issue #119b) - testing it here would have tested the previous release.
      - name: Smoke test released full box (amd64)
        env:
          IMAGE: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}:${{ steps.version.outputs.version }}-amd64
        run: |
          bash scripts/ci/run-with-budget-warning.sh 600 "full box smoke test" \
            bash scripts/ci/test-box.sh full "$IMAGE"

  # === BUILD AND PUSH ARM64 IMAGE ===
  # Using native ARM64 runner for optimal build performance
  docker-build-push-arm64:
    runs-on: ubuntu-24.04-arm  # Native ARM64 runner (free for public repos since Jan 2025)
    # Measured maximum 30.8 minutes; kept level with the amd64 job above.
    timeout-minutes: 90
    needs: [docker-build-push]
    if: |
      !cancelled() &&
      (inputs.essentials-arm64-result == 'success' || inputs.essentials-arm64-result == 'skipped') &&
      (inputs.languages-arm64-result == 'success' || inputs.languages-arm64-result == 'skipped') &&
      needs.docker-build-push.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && fromJSON(inputs.changes)['should-build'] == 'true') ||
        (github.event_name == 'workflow_dispatch')
      )
    permissions:
      contents: read
      packages: write

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: main  # Always use latest main for releases

      # Fix for issue #41: Free disk space to prevent "No space left on device" errors
      # ARM64 runners have more disk space (~45 GB) but we still clean up for safety
      # See: docs/case-studies/issue-41/CASE-STUDY.md
      - name: Free disk space
        uses: ./.github/actions/free-disk-space
        with:
          tool-cache: false  # Keep tool cache for setup-* action compatibility
          android: true      # Free ~14 GB
          dotnet: true       # Free ~2.7 GB
          haskell: true      # Free ~0 GB (not pre-installed)
          large-packages: true  # Free ~5.3 GB
          docker-images: true   # Clean existing Docker images
          swap-storage: true    # Free ~4 GB

      # One release, one version (issue #123): the pipeline computed it once in
      # release.yml's detect-changes job and handed it over inside `changes`.
      # See scripts/release/release-version.sh for what this replaced and why.
      - name: Get latest version
        id: version
        env:
          PIPELINE_VERSION: ${{ fromJSON(inputs.changes)['version'] }}
        run: bash scripts/release/release-version.sh

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx-resilient

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Issue #82: tolerate Docker Hub login failure (e.g. expired DOCKERHUB_TOKEN)
      # so that pushes to GHCR still proceed instead of taking down every build job.
      - name: Log in to Docker Hub
        id: dockerhub-login
        continue-on-error: true
        uses: ./.github/actions/dockerhub-login
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID == '' && secrets.DOCKERHUB_TOKEN || '' }}
          oidc-connection-id: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          oidc-organization: ${{ vars.DOCKERHUB_ORGANIZATION }}

      - name: "Check Docker Hub login (issue #82)"
        if: steps.dockerhub-login.outcome != 'success'
        run: |
          echo "::warning title=Docker Hub login failed::Docker Hub login failed (outcome=${{ steps.dockerhub-login.outcome }}). The DOCKERHUB_TOKEN repository secret is most likely expired or revoked. See docs/case-studies/issue-82/CASE-STUDY.md for the rotation runbook. The job will continue and push to GHCR; guarded Docker Hub publish steps will be skipped, while unguarded Docker Hub push attempts may fail without failing the job."

      - name: Determine base images
        id: base-images
        env:
          UPSTREAM_BUILT: ${{ inputs.essentials-built-arm64 }}
          LANGUAGES_RESULT: ${{ inputs.languages-arm64-result }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Essentials base image
          if [ "$UPSTREAM_BUILT" = "true" ]; then
            echo "essentials=${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}-essentials:${VERSION}-arm64" >> "$GITHUB_OUTPUT"
          else
            echo "essentials=${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}-essentials:latest-arm64" >> "$GITHUB_OUTPUT"
          fi

          # Language images
          for lang in python go rust java kotlin ruby php perl swift lean rocq; do
            if [ "$LANGUAGES_RESULT" = "success" ]; then
              echo "${lang}=${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}-${lang}:${VERSION}-arm64" >> "$GITHUB_OUTPUT"
            else
              echo "${lang}=${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}-${lang}:latest-arm64" >> "$GITHUB_OUTPUT"
            fi
          done

      # Labels only; see the amd64 job for why the tags are not computed here.
      - name: Extract metadata (labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}
          flavor: |
            suffix=-arm64
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}

      # The list the amd64 job computed, in this architecture's spelling. Asking
      # the clock again here is exactly the mistake that made a build straddling
      # midnight UTC unmanifestable (issue #119b).
      - name: Compute the tags this release publishes
        id: tags
        env:
          IMAGE_TAGS: ${{ needs.docker-build-push.outputs.tags }}
        run: |
          {
            echo "refs<<TAGS_EOF"
            bash scripts/release/image-tags.sh \
              --image "${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}" --suffix -arm64
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push full box (arm64)
        id: build
        continue-on-error: true
        timeout-minutes: 40
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ubuntu/24.04/full-box/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            ESSENTIALS_IMAGE=${{ steps.base-images.outputs.essentials }}
            PYTHON_IMAGE=${{ steps.base-images.outputs.python }}
            GO_IMAGE=${{ steps.base-images.outputs.go }}
            RUST_IMAGE=${{ steps.base-images.outputs.rust }}
            JAVA_IMAGE=${{ steps.base-images.outputs.java }}
            KOTLIN_IMAGE=${{ steps.base-images.outputs.kotlin }}
            RUBY_IMAGE=${{ steps.base-images.outputs.ruby }}
            PHP_IMAGE=${{ steps.base-images.outputs.php }}
            PERL_IMAGE=${{ steps.base-images.outputs.perl }}
            SWIFT_IMAGE=${{ steps.base-images.outputs.swift }}
            LEAN_IMAGE=${{ steps.base-images.outputs.lean }}
            ROCQ_IMAGE=${{ steps.base-images.outputs.rocq }}
          tags: ${{ steps.tags.outputs.refs }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false  # Prevents unknown/unknown platform in registry
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Retry push on transient GHCR 403 errors (Issue #78)
      - name: Retry push full box (arm64) on failure
        if: steps.build.outcome == 'failure'
        env:
          ALL_TAGS: ${{ steps.tags.outputs.refs }}
        run: |
          TAG_ARGS=()
          while IFS= read -r tag; do
            tag=$(echo "$tag" | xargs)
            [ -z "$tag" ] && continue
            TAG_ARGS+=(--tag "$tag")
          done <<< "$ALL_TAGS"
          bash scripts/release/buildx-retry.sh \
              --file ubuntu/24.04/full-box/Dockerfile \
              --platform linux/arm64 \
              --build-arg ESSENTIALS_IMAGE=${{ steps.base-images.outputs.essentials }} \
              --build-arg PYTHON_IMAGE=${{ steps.base-images.outputs.python }} \
              --build-arg GO_IMAGE=${{ steps.base-images.outputs.go }} \
              --build-arg RUST_IMAGE=${{ steps.base-images.outputs.rust }} \
              --build-arg JAVA_IMAGE=${{ steps.base-images.outputs.java }} \
              --build-arg KOTLIN_IMAGE=${{ steps.base-images.outputs.kotlin }} \
              --build-arg RUBY_IMAGE=${{ steps.base-images.outputs.ruby }} \
              --build-arg PHP_IMAGE=${{ steps.base-images.outputs.php }} \
              --build-arg PERL_IMAGE=${{ steps.base-images.outputs.perl }} \
              --build-arg SWIFT_IMAGE=${{ steps.base-images.outputs.swift }} \
              --build-arg LEAN_IMAGE=${{ steps.base-images.outputs.lean }} \
              --build-arg ROCQ_IMAGE=${{ steps.base-images.outputs.rocq }} \
              "${TAG_ARGS[@]}" \
              --provenance=false \
              --cache-from type=gha \
              --push \
              .

  # === CREATE MULTI-ARCH MANIFEST ===
      # Issue #115 (RC-3): GHCR is the registry of record - it is written with
      # the per-run GITHUB_TOKEN, which cannot expire - and Docker Hub is a
      # mirror of it. docker/metadata-action now emits GHCR names only, so the
      # Docker Hub names are derived from them by rewriting the registry prefix.
      - name: Mirror full box (arm64) to Docker Hub
        if: steps.dockerhub-login.outcome == 'success'
        env:
          GHCR_TAGS: ${{ steps.tags.outputs.refs }}
        run: |
          GHCR_PREFIX="${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}"
          DH_PREFIX="${{ env.DOCKERHUB_IMAGE_NAME }}"
          SOURCE="${GHCR_PREFIX}:${{ steps.version.outputs.version }}-arm64"

          TARGETS=()
          while IFS= read -r tag; do
            tag=$(echo "$tag" | xargs)
            [ -z "$tag" ] && continue
            suffix="${tag#"$GHCR_PREFIX"}"
            # A name the prefix rewrite does not apply to is not ours to mirror.
            [ "$suffix" = "$tag" ] && continue
            TARGETS+=("${DH_PREFIX}${suffix}")
          done <<< "$GHCR_TAGS"

          bash scripts/release/mirror-to-dockerhub.sh "$SOURCE" "${TARGETS[@]}"

  docker-manifest:
    runs-on: ubuntu-24.04
    # Measured maximum 1.4 minutes: this job only assembles manifests.
    timeout-minutes: 10
    needs: [docker-build-push, docker-build-push-arm64]
    if: |
      !cancelled() &&
      needs.docker-build-push.result == 'success' &&
      needs.docker-build-push-arm64.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch')
      )
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: main

      # One release, one version (issue #123): the pipeline computed it once in
      # release.yml's detect-changes job and handed it over inside `changes`.
      # See scripts/release/release-version.sh for what this replaced and why.
      - name: Get latest version
        id: version
        env:
          PIPELINE_VERSION: ${{ fromJSON(inputs.changes)['version'] }}
        run: bash scripts/release/release-version.sh

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Issue #82: tolerate Docker Hub login failure (e.g. expired DOCKERHUB_TOKEN)
      # so that pushes to GHCR still proceed instead of taking down every build job.
      - name: Log in to Docker Hub
        id: dockerhub-login
        continue-on-error: true
        uses: ./.github/actions/dockerhub-login
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID == '' && secrets.DOCKERHUB_TOKEN || '' }}
          oidc-connection-id: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          oidc-organization: ${{ vars.DOCKERHUB_ORGANIZATION }}

      - name: "Check Docker Hub login (issue #82)"
        if: steps.dockerhub-login.outcome != 'success'
        run: |
          echo "::warning title=Docker Hub login failed::Docker Hub login failed (outcome=${{ steps.dockerhub-login.outcome }}). The DOCKERHUB_TOKEN repository secret is most likely expired or revoked. See docs/case-studies/issue-82/CASE-STUDY.md for the rotation runbook. The job will continue and push to GHCR; guarded Docker Hub publish steps will be skipped, while unguarded Docker Hub push attempts may fail without failing the job."

      # Every tag a user pulls is written here, and nowhere else (issue #119b):
      # the date and commit tags used to be left as whatever the amd64 job had
      # pushed, so `box:20260907` served linux/amd64 alone.
      - name: Create and push multi-arch manifests (GHCR)
        env:
          TAGS: ${{ needs.docker-build-push.outputs.tags }}
        run: |
          # shellcheck disable=SC2086  # the tag list is one argument per tag
          bash scripts/release/create-multiarch-manifest.sh \
            "${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}" $TAGS

      # Copy the index GHCR now serves, rather than assembling a second one from
      # the mirrored per-architecture tags (issue #119a). Those tags are indexes
      # themselves - `docker buildx imagetools create` always writes one - and
      # `docker manifest create` refuses an index as a source, which is why
      # run 34056619231 retried "docker.io/***/box:2.7.0-amd64 is a manifest
      # list" three times and left konard/box:2.7.0 amd64-only. There is also
      # nothing to assemble: the correct answer already exists on GHCR.
      - name: Mirror the multi-arch manifests to Docker Hub
        if: steps.dockerhub-login.outcome == 'success'
        env:
          IMAGE_TAGS: ${{ needs.docker-build-push.outputs.tags }}
        run: |
          mapfile -t TARGETS < <(bash scripts/release/image-tags.sh \
            --image "${{ env.DOCKERHUB_IMAGE_NAME }}")

          # The step above published every one of these tags on GHCR as the same
          # index, so any of them names it; take the first rather than re-deriving
          # a version this job read from its own checkout.
          read -r -a TAGS <<<"$IMAGE_TAGS"

          bash scripts/release/mirror-to-dockerhub.sh \
            "${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}:${TAGS[0]}" \
            "${TARGETS[@]}"

      - name: Skip Docker Hub multi-arch manifests
        if: steps.dockerhub-login.outcome != 'success'
        run: |
          echo "::warning title=Docker Hub manifests skipped::Skipping the Docker Hub mirror of the multi-arch manifests because Docker Hub login outcome was ${{ steps.dockerhub-login.outcome }}. GHCR manifests were still published."

  # === STATUS ===
  #
  # `needs.<job>.result` cannot leave a called workflow: only `jobs.<id>.outputs`
  # can. Before the split, the full-box jobs read those results directly; this job
  # copies them into workflow outputs so the caller can hand them to the next
  # family and the per-job conditions stay exactly what they were (issue #115).
  # `docker-build-push`, `docker-build-push-arm64`, `docker-manifest` includes matrix jobs, whose rollup result is what the
  # conditions were written against - a per-leg step output could not reproduce it.
  status:
    name: full / status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [docker-build-push, docker-build-push-arm64, docker-manifest]
    if: ${{ !cancelled() }}
    outputs:
      amd64-result: ${{ needs.docker-build-push.result }}
      arm64-result: ${{ needs.docker-build-push-arm64.result }}
      manifest-result: ${{ needs.docker-manifest.result }}
    steps:
      - name: Summarise
        run: |
          {
            echo "### full / status"
            echo ""
            echo "| job | result |"
            echo "| --- | --- |"
            echo "| docker-build-push | ${{ needs.docker-build-push.result }} |"
            echo "| docker-build-push-arm64 | ${{ needs.docker-build-push-arm64.result }} |"
            echo "| docker-manifest | ${{ needs.docker-manifest.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
