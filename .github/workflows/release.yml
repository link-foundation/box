        if: |
          steps.check-lang.outputs.should_build == 'true' &&
          steps.dockerhub-login.outcome == 'success'
        run: |
          bash scripts/release/mirror-to-dockerhub.sh \
            "${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}-${{ matrix.language }}:${{ steps.version.outputs.version }}-amd64" \
            "${{ env.DOCKERHUB_IMAGE_NAME }}-${{ matrix.language }}:latest-amd64" \
            "${{ env.DOCKERHUB_IMAGE_NAME }}-${{ matrix.language }}:${{ steps.version.outputs.version }}-amd64"

      # PHP-specific: Add local/global suffix tags based on install method (Issue #44)
      - name: Tag PHP image with install method suffix (amd64)
        id: php-method
        if: steps.check-lang.outputs.should_build == 'true' && matrix.language == 'php'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SRC="${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}-php:${VERSION}-amd64"

          # Pull the image just published to GHCR and inspect the marker file.
          docker pull "$SRC"
          PHP_METHOD=$(docker run --rm "$SRC" cat /home/box/.php-install-method 2>/dev/null || echo "unknown")
          echo "PHP install method (amd64): $PHP_METHOD"
          echo "method=${PHP_METHOD}" >> "$GITHUB_OUTPUT"

          if [ "$PHP_METHOD" = "local" ] || [ "$PHP_METHOD" = "global" ]; then
            docker tag "$SRC" "${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}-php:latest-amd64-${PHP_METHOD}"
            docker tag "$SRC" "${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}-php:${VERSION}-amd64-${PHP_METHOD}"
            docker push "${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}-php:latest-amd64-${PHP_METHOD}"
            docker push "${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}-php:${VERSION}-amd64-${PHP_METHOD}"
            echo "Tagged PHP image with -${PHP_METHOD} suffix"
          fi

      # Issue #115: the Docker Hub copies of the suffixed PHP tags are a mirror
      # of the GHCR tags above. Pushing both registries from one step meant an
      # expired DOCKERHUB_TOKEN failed a job whose real output (the GHCR image)
      # had already been published successfully.
      - name: Mirror suffixed PHP tags to Docker Hub (amd64)
        if: |
          steps.check-lang.outputs.should_build == 'true' &&
          matrix.language == 'php' &&
          steps.dockerhub-login.outcome == 'success' &&
          (steps.php-method.outputs.method == 'local' || steps.php-method.outputs.method == 'global')
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          METHOD="${{ steps.php-method.outputs.method }}"
          bash scripts/release/mirror-to-dockerhub.sh \
            "${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}-php:${VERSION}-amd64-${METHOD}" \
            "${{ env.DOCKERHUB_IMAGE_NAME }}-php:latest-amd64-${METHOD}" \
            "${{ env.DOCKERHUB_IMAGE_NAME }}-php:${VERSION}-amd64-${METHOD}"

