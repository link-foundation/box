        if: steps.check-lang.outputs.should_build == 'true' && steps.build-push.outcome == 'failure'
        run: |
          TAGS=(
            "${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}-${{ matrix.language }}:latest-amd64"
            "${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}-${{ matrix.language }}:${{ steps.version.outputs.version }}-amd64"
          )
          TAG_ARGS=()
          for tag in "${TAGS[@]}"; do
            TAG_ARGS+=(--tag "$tag")
          done
          bash scripts/release/buildx-retry.sh \
              --file ubuntu/24.04/${{ matrix.language }}/Dockerfile \
              --platform linux/amd64 \
              --build-arg ESSENTIALS_IMAGE=${{ steps.essentials-base.outputs.image }} \
              "${TAG_ARGS[@]}" \
              --provenance=false \
              --cache-from type=gha,scope=${{ matrix.language }}-amd64 \
              --push \
              .

      # Issue #115 (RC-3): GHCR is the registry of record - it is written with
      # the per-run GITHUB_TOKEN, which cannot expire - and Docker Hub is a
      # mirror of it. Pushing both registries in one `docker buildx build --push`
      # meant a single expired DOCKERHUB_TOKEN destroyed the GHCR tags and the
      # `cache-to: type=gha` export as collateral (run 33972074755).
