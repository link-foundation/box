name: Build and Release Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'scripts/**'
      - 'ubuntu/**'
      - '.github/workflows/release.yml'
      # The build jobs live in these called workflows (issue #115, RC-8).
      # Without them here, editing a build job would not trigger a build.
      - '.github/workflows/release-js.yml'
      - '.github/workflows/release-essentials.yml'
      - '.github/workflows/release-languages.yml'
      - '.github/workflows/release-full.yml'
      - '.github/workflows/release-dind.yml'
      - '.github/workflows/pr-tests.yml'
      - '.changeset/**'
      - 'VERSION'
  pull_request:
    types: [opened, synchronize, reopened]
  # Manual release support - allows instant version bump and release, or building current version
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Release mode: build-only (no push/release), bump-and-release (bump version then build+release), release-only (build+release current VERSION without bumping)'
        required: true
        type: choice
        default: 'build-only'
        options:
          - build-only
          - bump-and-release
          - release-only
      bump_type:
        description: 'Version bump type (only for bump-and-release mode)'
        required: false
        type: choice
        default: 'patch'
        options:
          - patch
          - minor
          - major
      description:
        description: 'Release description (optional, for bump-and-release mode)'
        required: false
        type: string

concurrency:
  # Push/dispatch runs keep the classic one-run-per-ref group.
  #
  # Pull request runs deliberately get a group of their own (issue #112 follow-up).
  # A shared group did not do what it promises here: on PR #113 four commits were
  # pushed inside twelve minutes and GitHub kept the run for the OLDEST one alive
  # — run 33959630651 started its `pr-test / full` job at 10:29, twenty-two
  # minutes after that commit had been superseded — while every newer run sat in
  # the `pending` state behind the group and was cancelled by the next one
  # without ever executing a step. A `pending` run cannot cancel its predecessor,
  # because it cannot run anything at all, so the group is the deadlock rather
  # than the cure. Supersession is handled explicitly instead, by the
  # `cancel-superseded` job below plus the per-job guard in every expensive job
  # (scripts/ci/supersede.sh).
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}-run-{2}', github.workflow, github.event.pull_request.number, github.run_id) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

# Least-privilege default. Every job that needs more declares it itself
# (contents: write for the version/release jobs, packages: write for the image
# builds, actions: write for the supersession guard). Without this, the four
# jobs that declare nothing — version-check, changeset-check, detect-changes and
# docker-build-test — ran with the repository's default token scope (issue #115).
permissions:
  contents: read

env:
  # The full-box Dockerfiles use `RUN --mount=type=bind,from=<stage>` to refresh
  # the copied rustup toolchains inside the same layer (issue #112). buildx
  # enables BuildKit implicitly; the plain `docker build` steps below need it
  # switched on explicitly or that syntax is a parse error.
  DOCKER_BUILDKIT: "1"
  # GitHub Container Registry
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_NAME: ${{ github.repository }}
  # Docker Hub
  DOCKERHUB_REGISTRY: docker.io
  DOCKERHUB_IMAGE_NAME: konard/box
jobs:
  # === CANCEL SUPERSEDED RUNS (PRs only) — issue #112 follow-up ===
  #
  # "We must fix our CI/CD, so previous commits skip execution in pull requests,
  #  if multiple are committed in the order. So we only execute on last commit,
  #  and reduce resource waste on all previous commits."
  #
  # This is the first job of every pull request run and it takes seconds: it asks
  # the API which runs of this workflow are still live for an earlier commit of
  # this PR and cancels them. Doing it from inside the run — rather than leaving
  # it to `concurrency` — is what makes it work, because the per-run concurrency
  # group above guarantees this job can actually start (see the note there).
  # Covered by experiments/test-issue112-supersede.sh.
  cancel-superseded:
    name: Cancel superseded runs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6

      - name: Cancel runs for superseded commits of this pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO_ID: ${{ github.event.pull_request.head.repo.id }}
        run: bash scripts/ci/supersede.sh cancel-older

  # === VERSION CHECK (PRs only) ===
  # Prohibit manual version changes in VERSION file - versions should only be changed by CI/CD
  version-check:
    name: Check for Manual Version Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for version changes in VERSION file
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          chmod +x scripts/release/check-version.sh
          ./scripts/release/check-version.sh

  # === CHANGESET CHECK (PRs only) ===
  # Ensure PRs with code changes include a changeset
  changeset-check:
    name: Check for Changesets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for changesets
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          # Skip for branches that don't need changesets
          if [[ "$GITHUB_HEAD_REF" == changeset-release/* ]] || [[ "$GITHUB_HEAD_REF" == changeset-manual-release-* ]]; then
            echo "Skipping changeset check for release PR"
            exit 0
          fi

          # Check if there are code changes (Dockerfile, scripts, etc.)
          git fetch origin "$GITHUB_BASE_REF" 2>/dev/null || true
          CODE_CHANGES=$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" | grep -E '^(Dockerfile|scripts/|ubuntu/|\.github/workflows/)' || true)

          if [ -z "$CODE_CHANGES" ]; then
            echo "No code changes detected, changeset not required"
            exit 0
          fi

          echo "Code changes detected:"
          echo "$CODE_CHANGES"
          echo ""

          chmod +x scripts/release/validate-changeset.sh
          ./scripts/release/validate-changeset.sh

  # === AUTOMATIC VERSION BUMP (push to main with changesets) ===
  apply-changesets:
    name: Apply Changesets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Gated on the preflight because this job writes the version. 2.5.0 has a
    # version bump commit, no git tag and no GitHub Release: the release that
    # was supposed to carry it could not publish anything, and the bump had
    # already happened (issue #117, point 5). A version this run cannot release
    # should not be created by it.
    needs: [preflight]
    if: needs.preflight.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    outputs:
      version_bumped: ${{ steps.apply.outputs.version_bumped }}
      new_version: ${{ steps.apply.outputs.new_version }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for changesets
        id: check
        run: |
          chmod +x scripts/release/check-changesets.sh
          ./scripts/release/check-changesets.sh

      - name: Apply changesets
        id: apply
        if: steps.check.outputs.has_changesets == 'true'
        run: |
          chmod +x scripts/release/apply-changesets.sh
          ./scripts/release/apply-changesets.sh

  # === MANUAL VERSION BUMP (workflow_dispatch with bump-and-release) ===
  version-bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Same reason as apply-changesets: do not mint a version this run has
    # already proved it cannot publish.
    needs: [preflight]
    if: needs.preflight.result == 'success' && github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'bump-and-release'
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.new_version }}
      version_bumped: ${{ steps.bump.outputs.bumped }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        # The dispatch inputs arrive through env, not through ${{ }} inside the
        # script. Interpolating them directly splices attacker-controlled text
        # into a shell that holds contents: write on main (issue #115).
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          DESCRIPTION: ${{ github.event.inputs.description }}
        run: |
          # Read current version
          CURRENT_VERSION=$(tr -d '[:space:]' < VERSION)
          echo "Current version: $CURRENT_VERSION"

          # Parse version components
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          # Bump based on type
          case "$BUMP_TYPE" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "New version: $NEW_VERSION"

          # Update VERSION file
          echo "$NEW_VERSION" > VERSION

          # Commit and push
          git add VERSION
          if [ -n "${DESCRIPTION:-}" ]; then
            git commit -m "$NEW_VERSION: $DESCRIPTION"
          else
            git commit -m "$NEW_VERSION"
          fi
          git push origin main

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "bumped=true" >> "$GITHUB_OUTPUT"

  # === RELEASE PREFLIGHT (issue #117) ===
  #
  # "In main branch our task is not to test the code, our task is to produce a
  #  release, so if any token or auth is not configured or unavailable - and we
  #  should be able to check it in advance - there is no need to do any resource
  #  intensive calculations. If we are missing any credentials needed to produce
  #  any of the planned releases, we should fail immediately."
  #
  # Run 33972074755 is what happens without this job. The Docker Hub token had
  # expired before the first byte was built; the login step is tolerant of
  # failure by design (issue #82), so the run logged one warning, built about
  # forty images across five families, skipped every mirror step and finished
  # green. 2.5.0 and 2.6.0 exist as git history and as GHCR blobs nobody can
  # pull, and not at all on Docker Hub.
  #
  # This costs two HTTP requests per registry and gates everything expensive.
  # It is not the same thing as gating the release on an image *push*, which
  # issue #115 (RC-18) removed on purpose: fail before the compute, warn after
  # it. Once the artifacts exist, a transient mirror error must never destroy
  # the GitHub Release.
  #
  # On a pull request it runs in report mode: a PR tests code rather than
  # producing a release, and a fork legitimately has no publishing secrets.
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      # The write probe uses this job's GITHUB_TOKEN, so the scope it proves is
      # the scope the build jobs will push with.
      packages: write
      # Only consumed when DOCKERHUB_OIDC_CONNECTIONID is set; without it the
      # trusted-publishing login cannot mint a token and the step is skipped.
      id-token: write
    outputs:
      ok: ${{ steps.preflight.outputs.ok }}
      failures: ${{ steps.preflight.outputs.failures }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Trusted publishing leaves a short-lived credential in the Docker CLI
      # config and puts no token in the environment; preflight-credentials.sh
      # reads it from there. Skipped entirely when the variable is unset, which
      # is the current state of this repository.
      - name: Log in to Docker Hub (trusted publishing)
        if: vars.DOCKERHUB_OIDC_CONNECTIONID != ''
        uses: ./.github/actions/dockerhub-login
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          oidc-connection-id: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          oidc-organization: ${{ vars.DOCKERHUB_ORGANIZATION }}

      - name: Verify every release target will accept a write
        id: preflight
        env:
          GHCR_REGISTRY: ${{ env.GHCR_REGISTRY }}
          GHCR_IMAGE_NAME: ${{ env.GHCR_IMAGE_NAME }}
          GHCR_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_REGISTRY: ${{ env.DOCKERHUB_REGISTRY }}
          DOCKERHUB_IMAGE_NAME: ${{ env.DOCKERHUB_IMAGE_NAME }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          # Left empty when the OIDC login above ran: the credential is then in
          # the Docker config and there is no token to pass.
          DOCKERHUB_TOKEN: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID == '' && secrets.DOCKERHUB_TOKEN || '' }}
          # Docker Hub is a release target, not an optional extra: README.md and
          # every release note advertise `docker pull konard/box`. Set the
          # repository variable DOCKERHUB_REQUIRED=0 to release on GHCR alone.
          DOCKERHUB_REQUIRED: ${{ vars.DOCKERHUB_REQUIRED || '1' }}
          # A private GHCR package blocks a release, because publishing more
          # versions of a package nobody can pull is exactly the work this job
          # exists to skip (issue #117, point 3). Set ALLOW_PRIVATE_GHCR=1 to
          # release anyway.
          ALLOW_PRIVATE_GHCR: ${{ vars.ALLOW_PRIVATE_GHCR || '0' }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bash scripts/release/preflight-credentials.sh --mode report
          else
            bash scripts/release/preflight-credentials.sh --mode release
          fi

  # === DETECT CHANGES (per-image granularity) ===
  detect-changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [apply-changesets, version-bump]
    # Always run, but wait for version jobs if they're running
    if: ${{ !cancelled() && (needs.apply-changesets.result == 'success' || needs.apply-changesets.result == 'skipped') && (needs.version-bump.result == 'success' || needs.version-bump.result == 'skipped') }}
    outputs:
      # Legacy change detection
      docker-changed: ${{ steps.detect.outputs.docker }}
      scripts-changed: ${{ steps.detect.outputs.scripts }}
      ubuntu-changed: ${{ steps.detect.outputs.ubuntu }}
      workflow-changed: ${{ steps.detect.outputs.workflow }}
      version-changed: ${{ steps.detect.outputs.version }}
      should-build: ${{ steps.detect.outputs.should-build }}
      version: ${{ steps.version.outputs.version }}
      # Per-image change detection
      js-changed: ${{ steps.detect.outputs.js }}
      essentials-changed: ${{ steps.detect.outputs.essentials }}
      full-changed: ${{ steps.detect.outputs.full }}
      common-changed: ${{ steps.detect.outputs.common }}
      # Per-language change detection
      python-changed: ${{ steps.detect.outputs.python }}
      go-changed: ${{ steps.detect.outputs.go }}
      rust-changed: ${{ steps.detect.outputs.rust }}
      java-changed: ${{ steps.detect.outputs.java }}
      kotlin-changed: ${{ steps.detect.outputs.kotlin }}
      ruby-changed: ${{ steps.detect.outputs.ruby }}
      php-changed: ${{ steps.detect.outputs.php }}
      perl-changed: ${{ steps.detect.outputs.perl }}
      swift-changed: ${{ steps.detect.outputs.swift }}
      lean-changed: ${{ steps.detect.outputs.lean }}
      rocq-changed: ${{ steps.detect.outputs.rocq }}
      cpp-changed: ${{ steps.detect.outputs.cpp }}
      assembly-changed: ${{ steps.detect.outputs.assembly }}
      dotnet-changed: ${{ steps.detect.outputs.dotnet }}
      r-changed: ${{ steps.detect.outputs.r }}
      # dind-box change detection (issue #80)
      dind-changed: ${{ steps.detect.outputs.dind }}

    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so detect-changes.sh can resolve the synthetic merge
          # commit's parents (HEAD^2^..HEAD^2 per-commit PR diff — issue #108).
          fetch-depth: 0
          ref: ${{ github.ref }}

      # Re-fetch if version was bumped to get latest commit
      - name: Fetch latest changes
        if: needs.version-bump.outputs.version_bumped == 'true' || needs.apply-changesets.outputs.version_bumped == 'true'
        run: |
          git fetch origin main
          git checkout main
          git pull origin main

      - name: Get version from VERSION file
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      # Single source of truth for change detection (issue #108).
      #
      # The crux of the fix: for pull_request events this script diffs only the
      # PR head's latest commit (HEAD^2^..HEAD^2 against the synthetic merge
      # commit), not the whole-PR diff against the base SHA. A trivial
      # synchronize commit (.gitkeep, docs, Markdown) therefore skips the
      # expensive build/test matrix even when earlier commits on the same PR
      # changed image source — those were already tested when pushed. For push
      # events it diffs the full pushed range (github.event.before..HEAD) so the
      # release build is never skipped. The classification logic lives in
      # scripts/ci/detect-changes.sh and is unit-tested by
      # experiments/test-issue108-detect-changes.sh.
      - name: Detect changes
        id: detect
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: bash scripts/ci/detect-changes.sh

  # === IMAGE BUILDS ===
  #
  # One caller job per image family (issue #115, RC-8). Each `uses:` runs the jobs
  # of the named file as part of *this* run, so the Actions UI still shows one
  # release run; the checks are renamed `<caller-job>/ <job name>`.
  #
  # Every per-job `if:` moved with its job. What used to be
  # `needs.<upstream-job>.result` is passed in as an input instead, because a
  # called workflow cannot read the caller's `needs` context - that is what the
  # `status` job in each file exists to publish. The conditions themselves are
  # unchanged, so a failure in one architecture still has exactly the effect it
  # had before the split.
  #
  # The guard below is the prefix every build job carried; it is hoisted here
  # once. Its `!cancelled()` matters: a caller job whose `needs` failed still
  # runs, so a broken family does not silently skip create-release.
  js:
    needs: [detect-changes, preflight]
    if: |
      !cancelled() &&
      needs.preflight.result == 'success' &&
      needs.detect-changes.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-changes.outputs.should-build == 'true') ||
        (github.event_name == 'workflow_dispatch')
      )
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-js.yml
    with:
      changes: ${{ toJSON(needs.detect-changes.outputs) }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  essentials:
    needs: [detect-changes, preflight, js]
    if: |
      !cancelled() &&
      needs.preflight.result == 'success' &&
      needs.detect-changes.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-changes.outputs.should-build == 'true') ||
        (github.event_name == 'workflow_dispatch')
      )
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-essentials.yml
    with:
      changes: ${{ toJSON(needs.detect-changes.outputs) }}
      js-built-amd64: ${{ needs.js.outputs.built-amd64 }}
      js-built-arm64: ${{ needs.js.outputs.built-arm64 }}
      js-amd64-result: ${{ needs.js.outputs.amd64-result }}
      js-arm64-result: ${{ needs.js.outputs.arm64-result }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  languages:
    needs: [detect-changes, preflight, essentials]
    if: |
      !cancelled() &&
      needs.preflight.result == 'success' &&
      needs.detect-changes.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-changes.outputs.should-build == 'true') ||
        (github.event_name == 'workflow_dispatch')
      )
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-languages.yml
    with:
      changes: ${{ toJSON(needs.detect-changes.outputs) }}
      essentials-built-amd64: ${{ needs.essentials.outputs.built-amd64 }}
      essentials-built-arm64: ${{ needs.essentials.outputs.built-arm64 }}
      essentials-amd64-result: ${{ needs.essentials.outputs.amd64-result }}
      essentials-arm64-result: ${{ needs.essentials.outputs.arm64-result }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  full:
    needs: [detect-changes, preflight, essentials, languages]
    if: |
      !cancelled() &&
      needs.preflight.result == 'success' &&
      needs.detect-changes.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-changes.outputs.should-build == 'true') ||
        (github.event_name == 'workflow_dispatch')
      )
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-full.yml
    with:
      changes: ${{ toJSON(needs.detect-changes.outputs) }}
      essentials-built-amd64: ${{ needs.essentials.outputs.built-amd64 }}
      essentials-built-arm64: ${{ needs.essentials.outputs.built-arm64 }}
      essentials-amd64-result: ${{ needs.essentials.outputs.amd64-result }}
      essentials-arm64-result: ${{ needs.essentials.outputs.arm64-result }}
      languages-amd64-result: ${{ needs.languages.outputs.amd64-result }}
      languages-arm64-result: ${{ needs.languages.outputs.arm64-result }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  dind:
    needs: [detect-changes, preflight, js, essentials, languages, full]
    if: |
      !cancelled() &&
      needs.preflight.result == 'success' &&
      needs.detect-changes.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-changes.outputs.should-build == 'true') ||
        (github.event_name == 'workflow_dispatch')
      )
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-dind.yml
    with:
      changes: ${{ toJSON(needs.detect-changes.outputs) }}
      js-manifest-result: ${{ needs.js.outputs.manifest-result }}
      essentials-manifest-result: ${{ needs.essentials.outputs.manifest-result }}
      languages-manifest-result: ${{ needs.languages.outputs.manifest-result }}
      full-manifest-result: ${{ needs.full.outputs.manifest-result }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # === PULL REQUEST TESTS ===
  #
  # Same idea, for the six pr-test tiers and the docker-build-test roll-up.
  # `version-check` and `changeset-check` only exist on a pull request, so their
  # results are passed in rather than re-derived.
  pr-tests:
    needs: [detect-changes, version-check, changeset-check]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/pr-tests.yml
    with:
      changes: ${{ toJSON(needs.detect-changes.outputs) }}
      detect-changes-result: ${{ needs.detect-changes.result }}
      version-check-result: ${{ needs.version-check.result }}
      changeset-check-result: ${{ needs.changeset-check.result }}


  # === CREATE GITHUB RELEASE ===
  create-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [detect-changes, preflight, js, essentials, languages, full, dind]
    # The release is created from the source state, not from the registry
    # (issue #115; hive-mind principle #13, "never gate the release on an image
    # push"). It waits for the manifest jobs so the notes can report what was
    # published, but `needs.full.result == 'success'` is deliberately
    # NOT required: a Docker Hub outage or an expired registry token used to
    # mean the tagged commit got no GitHub Release at all, and the release for
    # that version then had to be created by hand. Only detect-changes is
    # required, because its output is what decides there is anything to release.
    # The notes say per image which references actually resolve, so a partial
    # push produces an honest release instead of no release.
    if: |
      !cancelled() &&
      needs.preflight.result == 'success' &&
      needs.detect-changes.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch')
      )
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Get latest version
        id: version
        run: |
          git pull origin main || true
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Creating release for version: $VERSION"

      # There is deliberately no `docker login` in this job (issue #117).
      #
      # There used to be one, on the reasoning that an anonymous
      # `docker manifest inspect` cannot tell "this package does not exist"
      # from "you may not look at it". True, and it made the check useless: it
      # then measured what the publisher could see. The notes for v2.6.0 said
      # "28 of 56 image references resolve" while every one of the 56 was
      # unreachable for everybody else - the GHCR packages private, Docker Hub
      # empty behind an expired token.
      #
      # scripts/release/registry-probe.sh makes the distinction without a
      # credential: on GHCR a private package refuses the anonymous *token*
      # request with 401 while a missing one still issues a token and answers
      # 404 on the manifest. So the notes are now written from the reader's
      # view, which is the only view that decides whether a release happened.

      # The notes are generated from one image list by
      # scripts/release/build-release-notes.sh. They used to be 106 lines of
      # inline heredoc with a hand-written row per image, split across two steps
      # only to stay under GitHub's 21000-character per-step expression limit
      # (issue #80) - a limit a script does not have (issue #115).
      - name: Build release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
          GHCR_IMAGE: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}
          DOCKERHUB_IMAGE: ${{ env.DOCKERHUB_IMAGE_NAME }}
          # Ask the registries which of the advertised references exist. Off by
          # default so the generator stays offline-testable.
          VERIFY_IMAGES: '1'
        run: |
          bash scripts/release/build-release-notes.sh > /tmp/release-notes.md
          echo "=== release notes ($(wc -l < /tmp/release-notes.md) lines) ==="
          cat /tmp/release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          if gh release view "v${VERSION}" &>/dev/null; then
            echo "Release v${VERSION} already exists, updating..."
            gh release edit "v${VERSION}" --title "v${VERSION}" --notes-file /tmp/release-notes.md
          else
            echo "Creating new release v${VERSION}..."
            gh release create "v${VERSION}" --title "v${VERSION}" --notes-file /tmp/release-notes.md
          fi

          echo "GitHub Release v${VERSION} created/updated successfully"

      # Deliberately after the release is published, never before it (issue
      # #115 principle #13: never gate the release on an image push). An
      # operator always gets the tag and the notes; what this step decides is
      # whether the *run* is allowed to be green. A release nobody can pull is
      # not a successful release, and run 33972074755 reporting success is the
      # reason v2.5.0 and v2.6.0 went unnoticed for months (issue #117).
      - name: Verify the release is reachable without credentials
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GHCR_IMAGE: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}
          DOCKERHUB_IMAGE: ${{ env.DOCKERHUB_IMAGE_NAME }}
        run: |
          bash scripts/release/check-publication.sh
