          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}${{ steps.names.outputs.dind_suffix }}:latest-arm64
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}${{ steps.names.outputs.dind_suffix }}:${{ steps.version.outputs.version }}-arm64
          provenance: false
          cache-from: type=gha,scope=dind-${{ matrix.variant }}-arm64
          cache-to: type=gha,scope=dind-${{ matrix.variant }}-arm64,mode=max

      - name: Retry push ${{ matrix.variant }} dind-box (arm64) on failure
        if: steps.build-push.outcome == 'failure'
        run: |
          bash scripts/release/buildx-retry.sh \
              --file ubuntu/24.04/dind/Dockerfile \
              --platform linux/arm64 \
              --build-arg BASE_IMAGE=${{ steps.names.outputs.base_image }} \
              --tag ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}${{ steps.names.outputs.dind_suffix }}:latest-arm64 \
              --tag ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}${{ steps.names.outputs.dind_suffix }}:${{ steps.version.outputs.version }}-arm64 \
              --provenance=false \
              --cache-from type=gha,scope=dind-${{ matrix.variant }}-arm64 \
              --push \
              .

  # === CREATE DIND-BOX MULTI-ARCH MANIFESTS - issue #80 ===
      # Issue #115 (RC-3): GHCR is the registry of record - it is written with
      # the per-run GITHUB_TOKEN, which cannot expire - and Docker Hub is a
      # mirror of it. Pushing both registries in one `docker buildx build --push`
      # meant a single expired DOCKERHUB_TOKEN destroyed the GHCR tags and the
      # `cache-to: type=gha` export as collateral (run 33972074755).
      - name: Mirror ${{ matrix.variant }} dind-box (arm64) to Docker Hub
        if: steps.dockerhub-login.outcome == 'success'
        run: |
          bash scripts/release/mirror-to-dockerhub.sh \
            "${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}${{ steps.names.outputs.dind_suffix }}:${{ steps.version.outputs.version }}-arm64" \
            "${{ env.DOCKERHUB_IMAGE_NAME }}${{ steps.names.outputs.dind_suffix }}:latest-arm64" \
            "${{ env.DOCKERHUB_IMAGE_NAME }}${{ steps.names.outputs.dind_suffix }}:${{ steps.version.outputs.version }}-arm64"

  dind-manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [detect-changes, build-dind-amd64, build-dind-arm64]
    strategy:
      fail-fast: false
      matrix:
        variant: [js, essentials, python, go, rust, java, kotlin, ruby, php, perl, swift, lean, rocq, full]
    if: |
      !cancelled() &&
      needs.detect-changes.result == 'success' &&
      needs.build-dind-amd64.result == 'success' &&
      needs.build-dind-arm64.result == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Get latest version
        id: version
        run: |
          git pull origin main || true
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Issue #82: tolerate Docker Hub login failure (e.g. expired DOCKERHUB_TOKEN)
      # so that pushes to GHCR still proceed instead of taking down every build job.
      - name: Log in to Docker Hub
        id: dockerhub-login
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Check Docker Hub login (issue #82)"
        if: steps.dockerhub-login.outcome != 'success'
        run: |
          echo "::warning title=Docker Hub login failed::Docker Hub login failed (outcome=${{ steps.dockerhub-login.outcome }}). The DOCKERHUB_TOKEN repository secret is most likely expired or revoked. See docs/case-studies/issue-82/CASE-STUDY.md for the rotation runbook. The job will continue and push to GHCR; guarded Docker Hub publish steps will be skipped, while unguarded Docker Hub push attempts may fail without failing the job."

      - name: Compute dind suffix
        id: names
        run: |
          NAME="${{ matrix.variant }}"
          if [ "$NAME" = "full" ]; then
            echo "dind_suffix=-dind" >> "$GITHUB_OUTPUT"
          else
            echo "dind_suffix=-${NAME}-dind" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push ${{ matrix.variant }} dind multi-arch manifests (GHCR)
        run: |
          bash scripts/release/create-multiarch-manifest.sh \
            "${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}${{ steps.names.outputs.dind_suffix }}" \
            latest "${{ steps.version.outputs.version }}"

      - name: Create and push ${{ matrix.variant }} dind multi-arch manifests (Docker Hub)
        if: steps.dockerhub-login.outcome == 'success'
        env:
          # A Docker Hub manifest failure must not fail a release whose GHCR
          # manifest is already published (issue #115, RC-3).
          MANIFEST_REQUIRED: '0'
        run: |
          bash scripts/release/create-multiarch-manifest.sh \
            "${{ env.DOCKERHUB_IMAGE_NAME }}${{ steps.names.outputs.dind_suffix }}" \
            latest "${{ steps.version.outputs.version }}"

      - name: Skip ${{ matrix.variant }} dind Docker Hub multi-arch manifests
        if: steps.dockerhub-login.outcome != 'success'
        run: |
          echo "::warning title=Docker Hub manifest skipped::Skipping ${{ matrix.variant }} dind Docker Hub multi-arch manifests because Docker Hub login outcome was ${{ steps.dockerhub-login.outcome }}. GHCR manifests were still published."

  # === CREATE GITHUB RELEASE ===
  create-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [detect-changes, docker-manifest, js-manifest, essentials-manifest, languages-manifest, dind-manifest]
    # The release is created from the source state, not from the registry
    # (issue #115; hive-mind principle #13, "never gate the release on an image
    # push"). It waits for the manifest jobs so the notes can report what was
    # published, but `needs.docker-manifest.result == 'success'` is deliberately
    # NOT required: a Docker Hub outage or an expired registry token used to
    # mean the tagged commit got no GitHub Release at all, and the release for
    # that version then had to be created by hand. Only detect-changes is
    # required, because its output is what decides there is anything to release.
    # The notes say per image which references actually resolve, so a partial
    # push produces an honest release instead of no release.
    if: |
      !cancelled() &&
      needs.detect-changes.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch')
      )
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Get latest version
        id: version
        run: |
          git pull origin main || true
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Creating release for version: $VERSION"

      # Anonymous `docker manifest inspect` cannot tell "this package does not
      # exist" from "you may not look at it" on GHCR, and the notes must not
      # report a published image as missing. Logging in with the job's own token
      # makes the distinction real. Docker Hub is public and needs no login;
      # if it rate-limits, the check reports "unknown", never "missing".
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The notes are generated from one image list by
      # scripts/release/build-release-notes.sh. They used to be 106 lines of
      # inline heredoc with a hand-written row per image, split across two steps
      # only to stay under GitHub's 21000-character per-step expression limit
      # (issue #80) - a limit a script does not have (issue #115).
      - name: Build release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
          GHCR_IMAGE: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}
          DOCKERHUB_IMAGE: ${{ env.DOCKERHUB_IMAGE_NAME }}
          # Ask the registries which of the advertised references exist. Off by
          # default so the generator stays offline-testable.
          VERIFY_IMAGES: '1'
        run: |
          bash scripts/release/build-release-notes.sh > /tmp/release-notes.md
          echo "=== release notes ($(wc -l < /tmp/release-notes.md) lines) ==="
          cat /tmp/release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          if gh release view "v${VERSION}" &>/dev/null; then
            echo "Release v${VERSION} already exists, updating..."
            gh release edit "v${VERSION}" --title "v${VERSION}" --notes-file /tmp/release-notes.md
          else
            echo "Creating new release v${VERSION}..."
            gh release create "v${VERSION}" --title "v${VERSION}" --notes-file /tmp/release-notes.md
          fi

          echo "GitHub Release v${VERSION} created/updated successfully"
