name: Build and Release Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'scripts/**'
      - 'ubuntu/**'
      - '.github/workflows/release.yml'
      - '.changeset/**'
      - 'VERSION'
  pull_request:
    types: [opened, synchronize, reopened]
  # Manual release support - allows instant version bump and release, or building current version
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Release mode: build-only (no push/release), bump-and-release (bump version then build+release), release-only (build+release current VERSION without bumping)'
        required: true
        type: choice
        default: 'build-only'
        options:
          - build-only
          - bump-and-release
          - release-only
      bump_type:
        description: 'Version bump type (only for bump-and-release mode)'
        required: false
        type: choice
        default: 'patch'
        options:
          - patch
          - minor
          - major
      description:
        description: 'Release description (optional, for bump-and-release mode)'
        required: false
        type: string

concurrency:
  # Push/dispatch runs keep the classic one-run-per-ref group.
  #
  # Pull request runs deliberately get a group of their own (issue #112 follow-up).
  # A shared group did not do what it promises here: on PR #113 four commits were
  # pushed inside twelve minutes and GitHub kept the run for the OLDEST one alive
  # — run 33959630651 started its `pr-test / full` job at 10:29, twenty-two
  # minutes after that commit had been superseded — while every newer run sat in
  # the `pending` state behind the group and was cancelled by the next one
  # without ever executing a step. A `pending` run cannot cancel its predecessor,
  # because it cannot run anything at all, so the group is the deadlock rather
  # than the cure. Supersession is handled explicitly instead, by the
  # `cancel-superseded` job below plus the per-job guard in every expensive job
  # (scripts/ci/supersede.sh).
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}-run-{2}', github.workflow, github.event.pull_request.number, github.run_id) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

# Least-privilege default. Every job that needs more declares it itself
# (contents: write for the version/release jobs, packages: write for the image
# builds, actions: write for the supersession guard). Without this, the four
# jobs that declare nothing — version-check, changeset-check, detect-changes and
# docker-build-test — ran with the repository's default token scope (issue #115).
permissions:
  contents: read

env:
  # The full-box Dockerfiles use `RUN --mount=type=bind,from=<stage>` to refresh
  # the copied rustup toolchains inside the same layer (issue #112). buildx
  # enables BuildKit implicitly; the plain `docker build` steps below need it
  # switched on explicitly or that syntax is a parse error.
  DOCKER_BUILDKIT: "1"
  # GitHub Container Registry
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_NAME: ${{ github.repository }}
  # Docker Hub
  DOCKERHUB_REGISTRY: docker.io
  DOCKERHUB_IMAGE_NAME: konard/box

jobs:
  # === CANCEL SUPERSEDED RUNS (PRs only) — issue #112 follow-up ===
  #
  # "We must fix our CI/CD, so previous commits skip execution in pull requests,
  #  if multiple are committed in the order. So we only execute on last commit,
  #  and reduce resource waste on all previous commits."
  #
  # This is the first job of every pull request run and it takes seconds: it asks
  # the API which runs of this workflow are still live for an earlier commit of
  # this PR and cancels them. Doing it from inside the run — rather than leaving
  # it to `concurrency` — is what makes it work, because the per-run concurrency
  # group above guarantees this job can actually start (see the note there).
  # Covered by experiments/test-issue112-supersede.sh.
  cancel-superseded:
    name: Cancel superseded runs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6

      - name: Cancel runs for superseded commits of this pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO_ID: ${{ github.event.pull_request.head.repo.id }}
        run: bash scripts/ci/supersede.sh cancel-older

  # === VERSION CHECK (PRs only) ===
  # Prohibit manual version changes in VERSION file - versions should only be changed by CI/CD
  version-check:
    name: Check for Manual Version Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for version changes in VERSION file
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          chmod +x scripts/release/check-version.sh
          ./scripts/release/check-version.sh

  # === CHANGESET CHECK (PRs only) ===
  # Ensure PRs with code changes include a changeset
  changeset-check:
    name: Check for Changesets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for changesets
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          # Skip for branches that don't need changesets
          if [[ "$GITHUB_HEAD_REF" == changeset-release/* ]] || [[ "$GITHUB_HEAD_REF" == changeset-manual-release-* ]]; then
            echo "Skipping changeset check for release PR"
            exit 0
          fi

          # Check if there are code changes (Dockerfile, scripts, etc.)
          git fetch origin "$GITHUB_BASE_REF" 2>/dev/null || true
          CODE_CHANGES=$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" | grep -E '^(Dockerfile|scripts/|ubuntu/|\.github/workflows/)' || true)

          if [ -z "$CODE_CHANGES" ]; then
            echo "No code changes detected, changeset not required"
            exit 0
          fi

          echo "Code changes detected:"
          echo "$CODE_CHANGES"
          echo ""

          chmod +x scripts/release/validate-changeset.sh
          ./scripts/release/validate-changeset.sh

  # === AUTOMATIC VERSION BUMP (push to main with changesets) ===
  apply-changesets:
    name: Apply Changesets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    outputs:
      version_bumped: ${{ steps.apply.outputs.version_bumped }}
      new_version: ${{ steps.apply.outputs.new_version }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for changesets
        id: check
        run: |
          chmod +x scripts/release/check-changesets.sh
          ./scripts/release/check-changesets.sh

      - name: Apply changesets
        id: apply
        if: steps.check.outputs.has_changesets == 'true'
        run: |
          chmod +x scripts/release/apply-changesets.sh
          ./scripts/release/apply-changesets.sh

  # === MANUAL VERSION BUMP (workflow_dispatch with bump-and-release) ===
  version-bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'bump-and-release'
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.new_version }}
      version_bumped: ${{ steps.bump.outputs.bumped }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        # The dispatch inputs arrive through env, not through ${{ }} inside the
        # script. Interpolating them directly splices attacker-controlled text
        # into a shell that holds contents: write on main (issue #115).
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          DESCRIPTION: ${{ github.event.inputs.description }}
        run: |
          # Read current version
          CURRENT_VERSION=$(tr -d '[:space:]' < VERSION)
          echo "Current version: $CURRENT_VERSION"

          # Parse version components
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          # Bump based on type
          case "$BUMP_TYPE" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "New version: $NEW_VERSION"

          # Update VERSION file
          echo "$NEW_VERSION" > VERSION

          # Commit and push
          git add VERSION
          if [ -n "${DESCRIPTION:-}" ]; then
            git commit -m "$NEW_VERSION: $DESCRIPTION"
          else
            git commit -m "$NEW_VERSION"
          fi
          git push origin main

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "bumped=true" >> "$GITHUB_OUTPUT"

  # === DETECT CHANGES (per-image granularity) ===
  detect-changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [apply-changesets, version-bump]
    # Always run, but wait for version jobs if they're running
    if: ${{ !cancelled() && (needs.apply-changesets.result == 'success' || needs.apply-changesets.result == 'skipped') && (needs.version-bump.result == 'success' || needs.version-bump.result == 'skipped') }}
    outputs:
      # Legacy change detection
      docker-changed: ${{ steps.detect.outputs.docker }}
      scripts-changed: ${{ steps.detect.outputs.scripts }}
      ubuntu-changed: ${{ steps.detect.outputs.ubuntu }}
      workflow-changed: ${{ steps.detect.outputs.workflow }}
      version-changed: ${{ steps.detect.outputs.version }}
      should-build: ${{ steps.detect.outputs.should-build }}
      version: ${{ steps.version.outputs.version }}
      # Per-image change detection
      js-changed: ${{ steps.detect.outputs.js }}
      essentials-changed: ${{ steps.detect.outputs.essentials }}
      full-changed: ${{ steps.detect.outputs.full }}
      common-changed: ${{ steps.detect.outputs.common }}
      # Per-language change detection
      python-changed: ${{ steps.detect.outputs.python }}
      go-changed: ${{ steps.detect.outputs.go }}
      rust-changed: ${{ steps.detect.outputs.rust }}
      java-changed: ${{ steps.detect.outputs.java }}
      kotlin-changed: ${{ steps.detect.outputs.kotlin }}
      ruby-changed: ${{ steps.detect.outputs.ruby }}
      php-changed: ${{ steps.detect.outputs.php }}
      perl-changed: ${{ steps.detect.outputs.perl }}
      swift-changed: ${{ steps.detect.outputs.swift }}
      lean-changed: ${{ steps.detect.outputs.lean }}
      rocq-changed: ${{ steps.detect.outputs.rocq }}
      cpp-changed: ${{ steps.detect.outputs.cpp }}
      assembly-changed: ${{ steps.detect.outputs.assembly }}
      # dind-box change detection (issue #80)
      dind-changed: ${{ steps.detect.outputs.dind }}

    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so detect-changes.sh can resolve the synthetic merge
          # commit's parents (HEAD^2^..HEAD^2 per-commit PR diff — issue #108).
          fetch-depth: 0
          ref: ${{ github.ref }}

      # Re-fetch if version was bumped to get latest commit
      - name: Fetch latest changes
        if: needs.version-bump.outputs.version_bumped == 'true' || needs.apply-changesets.outputs.version_bumped == 'true'
        run: |
          git fetch origin main
          git checkout main
          git pull origin main

      - name: Get version from VERSION file
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      # Single source of truth for change detection (issue #108).
      #
      # The crux of the fix: for pull_request events this script diffs only the
      # PR head's latest commit (HEAD^2^..HEAD^2 against the synthetic merge
      # commit), not the whole-PR diff against the base SHA. A trivial
      # synchronize commit (.gitkeep, docs, Markdown) therefore skips the
      # expensive build/test matrix even when earlier commits on the same PR
      # changed image source — those were already tested when pushed. For push
      # events it diffs the full pushed range (github.event.before..HEAD) so the
      # release build is never skipped. The classification logic lives in
      # scripts/ci/detect-changes.sh and is unit-tested by
      # experiments/test-issue108-detect-changes.sh.
      - name: Detect changes
        id: detect
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: bash scripts/ci/detect-changes.sh

  # === BUILD AND TEST DOCKER IMAGES (PR) — issue #82 ===
  #
  # On every pull request we exercise *all* image configurations in parallel,
  # each on its own clean GitHub-hosted VM with maximum free disk space. The
  # parallel layout mirrors the production release matrix:
  #
  #   pr-test-js               (1 job)      - JS base box
  #   pr-test-essentials       (1 job)      - essentials box on JS
  #   pr-test-language         (matrix: 11) - one job per language box
  #   pr-test-full             (1 job)      - full-box (all languages)
  #   pr-test-dind             (matrix: 14) - one job per dind variant
  #                                            (js, essentials, 11 languages, full)
  #   docker-build-test        (1 job)      - aggregator for branch protection
  #
  # Each job rebuilds its required base chain locally with plain `docker build`
  # against the host Docker daemon. We deliberately do NOT use buildx with the
  # docker-container driver here because subsequent `FROM box-js` /
  # `FROM box-essentials` resolution in that driver would attempt a registry
  # pull (which fails on PR forks and on Docker Hub outages). The trade-off is
  # that each VM rebuilds JS and essentials from source — fine because every VM
  # has 30 GB freed up front and the parallel matrix means wall-clock is bound
  # by the slowest single image, not by the depth of the chain.
  #
  # Every build job runs `jlumbroso/free-disk-space@main` first to reclaim
  # ~30 GB before building, fixing the "no space left on device" regression
  # captured in run 25075335426 (see docs/case-studies/issue-82/).
  #
  # See: docs/case-studies/issue-82/CASE-STUDY.md

  # --- Tier 0: version policy (no image build, runs in seconds) ---
  # The resolvers in ubuntu/24.04/common.sh are the only thing keeping a rebuild
  # from shipping last year's runtimes (issue #112), and refresh-rust.sh depends
  # on a layer property (a delete after COPY --from reclaims nothing) that is
  # easy to regress. Both are covered without building an image, so this job
  # gates the expensive tiers below.
  pr-test-version-policy:
    name: pr-test / version-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [version-check, changeset-check]
    if: |
      !cancelled() &&
      (needs.version-check.result == 'success' || needs.version-check.result == 'skipped') &&
      (needs.changeset-check.result == 'success' || needs.changeset-check.result == 'skipped') &&
      github.event_name == 'pull_request'
    # The guard below cancels this run when its commit is superseded, which
    # needs write access to the Actions API (issue #112 follow-up).
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # A queued matrix job can start long after the run was created, by which
      # time the pull request may have moved on (issue #112 follow-up). Check
      # before spending a runner on a commit nobody is waiting for.
      - name: Stop if a newer commit superseded this run
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bash scripts/ci/supersede.sh stop-if-superseded
          # ...and keep watching from inside the job. Cancelling from the
          # outside needs a free runner, and a superseded run holding every
          # slot is exactly why there is none.
          setsid nohup bash scripts/ci/supersede.sh watch \
            > "$RUNNER_TEMP/supersede-watch.log" 2>&1 < /dev/null &

      - name: Version resolvers and one-version-per-language invariant
        run: bash experiments/version-policy-unit-test.sh

      - name: Layer semantics behind the rustup refresh
        run: bash experiments/rust-refresh-layer-test.sh

      - name: Superseded-commit guard (stubbed API) and its workflow wiring
        run: bash experiments/test-issue112-supersede.sh

      - name: Resolvers agree with the live upstream feeds
        # Not an assertion on a specific version — it fails only if a feed
        # changed shape and every resolver silently fell back to its pin.
        run: |
          set -e
          . ubuntu/24.04/common.sh
          for fn in resolve_node_lts_major resolve_nvm_version resolve_java_lts_major \
                    resolve_dotnet_lts_channel resolve_swift_versions resolve_opam_version; do
            value="$("$fn" | head -n1)"
            echo "$fn -> $value"
            [ -n "$value" ] || { echo "::error::$fn returned nothing"; exit 1; }
          done

  # --- Tier 1: JS box ---
  pr-test-js:
    name: pr-test / js
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [detect-changes, version-check, changeset-check, pr-test-version-policy]
    if: |
      !cancelled() &&
      needs.detect-changes.result == 'success' &&
      (needs.version-check.result == 'success' || needs.version-check.result == 'skipped') &&
      (needs.changeset-check.result == 'success' || needs.changeset-check.result == 'skipped') &&
      github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.should-build == 'true'
    # The guard below cancels this run when its commit is superseded, which
    # needs write access to the Actions API (issue #112 follow-up).
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # A queued matrix job can start long after the run was created, by which
      # time the pull request may have moved on (issue #112 follow-up). Check
      # before spending a runner on a commit nobody is waiting for.
      - name: Stop if a newer commit superseded this run
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bash scripts/ci/supersede.sh stop-if-superseded
          # ...and keep watching from inside the job. Cancelling from the
          # outside needs a free runner, and a superseded run holding every
          # slot is exactly why there is none.
          setsid nohup bash scripts/ci/supersede.sh watch \
            > "$RUNNER_TEMP/supersede-watch.log" 2>&1 < /dev/null &

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Build JS box (amd64)
        run: |
          set -e
          echo "=== Building JS box ==="
          docker build -f ubuntu/24.04/js/Dockerfile -t box-js .

      - name: Test JS box
        run: |
          set -e
          echo "=== Testing JS box ==="
          docker run --rm box-js bash -c '. $HOME/.nvm/nvm.sh && node --version'
          docker run --rm box-js bash -c 'export PATH=$HOME/.bun/bin:$PATH && bun --version'
          docker run --rm box-js bash -c 'export PATH=$HOME/.deno/bin:$PATH && deno --version'

          # Issue #112: the image must ship the Node LTS that was current when it
          # was built, exactly one of them, and a login shell must agree.
          echo "=== Node freshness and one-version invariant ==="
          . ubuntu/24.04/common.sh
          EXPECTED_NODE="$(resolve_node_lts_major)"
          echo "expected Node major: $EXPECTED_NODE"
          docker run --rm -e EXPECTED_NODE="$EXPECTED_NODE" box-js bash -c '
            set -e
            . "$HOME/.nvm/nvm.sh"
            actual="$(node --version)"
            echo "image ships $actual, nvm default alias -> $(nvm version default)"
            case "$actual" in
              v"$EXPECTED_NODE".*) ;;
              *) echo "::error::image ships $actual, expected Node $EXPECTED_NODE"; exit 1 ;;
            esac
            # Without an explicit default alias the image could ship one Node
            # and activate another (issue #112).
            [ "$(nvm version default)" = "$actual" ] \
              || { echo "::error::nvm default alias is $(nvm version default), active is $actual"; exit 1; }
            count="$(ls -1 "$HOME/.nvm/versions/node" | wc -l)"
            [ "$count" -eq 1 ] || { echo "::error::$count Node versions in the image"; exit 1; }
          '
          echo "=== JS box tests passed ==="

  # --- Tier 2: essentials box ---
  pr-test-essentials:
    name: pr-test / essentials
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [detect-changes, version-check, changeset-check, pr-test-js]
    if: |
      !cancelled() &&
      needs.pr-test-js.result == 'success' &&
      github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.should-build == 'true'
    # The guard below cancels this run when its commit is superseded, which
    # needs write access to the Actions API (issue #112 follow-up).
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # A queued matrix job can start long after the run was created, by which
      # time the pull request may have moved on (issue #112 follow-up). Check
      # before spending a runner on a commit nobody is waiting for.
      - name: Stop if a newer commit superseded this run
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bash scripts/ci/supersede.sh stop-if-superseded
          # ...and keep watching from inside the job. Cancelling from the
          # outside needs a free runner, and a superseded run holding every
          # slot is exactly why there is none.
          setsid nohup bash scripts/ci/supersede.sh watch \
            > "$RUNNER_TEMP/supersede-watch.log" 2>&1 < /dev/null &

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Build JS + essentials chain
        run: |
          set -e
          echo "=== Building JS box ==="
          docker build -f ubuntu/24.04/js/Dockerfile -t box-js .

          echo ""
          echo "=== Building essentials box (on JS) ==="
          docker build -f ubuntu/24.04/essentials-box/Dockerfile \
            --build-arg JS_IMAGE=box-js -t box-essentials .

      - name: Test essentials box
        run: |
          set -e
          echo "=== Testing essentials box ==="
          docker run --rm box-essentials gh --version
          docker run --rm box-essentials glab --version
          docker run --rm box-essentials gh-setup-git-identity --version
          docker run --rm box-essentials glab-setup-git-identity --version
          echo "=== Essentials box tests passed ==="

  # --- Tier 3: per-language boxes (parallel matrix, one VM each) ---
  pr-test-language:
    name: pr-test / ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [detect-changes, version-check, changeset-check, pr-test-version-policy, pr-test-essentials]
    if: |
      !cancelled() &&
      needs.pr-test-essentials.result == 'success' &&
      github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.should-build == 'true'
    strategy:
      fail-fast: false
      matrix:
        language: [python, go, rust, java, kotlin, ruby, php, perl, swift, lean, rocq]
    # The guard below cancels this run when its commit is superseded, which
    # needs write access to the Actions API (issue #112 follow-up).
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # A queued matrix job can start long after the run was created, by which
      # time the pull request may have moved on (issue #112 follow-up). Check
      # before spending a runner on a commit nobody is waiting for.
      - name: Stop if a newer commit superseded this run
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bash scripts/ci/supersede.sh stop-if-superseded
          # ...and keep watching from inside the job. Cancelling from the
          # outside needs a free runner, and a superseded run holding every
          # slot is exactly why there is none.
          setsid nohup bash scripts/ci/supersede.sh watch \
            > "$RUNNER_TEMP/supersede-watch.log" 2>&1 < /dev/null &

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Build JS + essentials + ${{ matrix.language }} chain
        run: |
          set -e
          echo "=== Building JS box ==="
          docker build -f ubuntu/24.04/js/Dockerfile -t box-js .

          echo ""
          echo "=== Building essentials box (on JS) ==="
          docker build -f ubuntu/24.04/essentials-box/Dockerfile \
            --build-arg JS_IMAGE=box-js -t box-essentials .

          echo ""
          echo "=== Building ${{ matrix.language }} box (on essentials) ==="
          docker build -f "ubuntu/24.04/${{ matrix.language }}/Dockerfile" \
            --build-arg ESSENTIALS_IMAGE=box-essentials \
            -t "box-${{ matrix.language }}" .

      - name: Test ${{ matrix.language }} box
        run: |
          set -e
          LANG="${{ matrix.language }}"
          IMG="box-${LANG}"
          echo "=== Testing ${LANG} box (${IMG}) ==="
          case "$LANG" in
            python)
              docker run --rm "$IMG" python3 --version
              docker run --rm "$IMG" pip3 --version
              ;;
            go)
              docker run --rm "$IMG" go version
              ;;
            rust)
              docker run --rm "$IMG" rustc --version
              docker run --rm "$IMG" cargo --version
              docker run --rm "$IMG" rustup --version
              ;;
            java)
              docker run --rm "$IMG" java -version
              ;;
            kotlin)
              docker run --rm "$IMG" kotlin -version
              ;;
            ruby)
              docker run --rm "$IMG" ruby --version
              docker run --rm "$IMG" gem --version
              ;;
            php)
              docker run --rm "$IMG" php --version
              echo "=== PHP install method ==="
              docker run --rm "$IMG" cat /home/box/.php-install-method
              ;;
            perl)
              docker run --rm "$IMG" perl --version
              ;;
            swift)
              docker run --rm "$IMG" swift --version
              ;;
            lean)
              docker run --rm "$IMG" lean --version
              ;;
            rocq)
              # rocq is invoked via "rocq --version" but historically coqc; check both
              docker run --rm "$IMG" bash -c 'rocq --version 2>/dev/null || coqc --version'
              ;;
          esac
          echo "=== ${LANG} box tests passed ==="

  # --- Tier 4: full box (integration smoke test, all languages on one VM) ---
  pr-test-full:
    name: pr-test / full
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: [detect-changes, version-check, changeset-check, pr-test-language]
    if: |
      !cancelled() &&
      needs.pr-test-language.result == 'success' &&
      github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.should-build == 'true'
    # The guard below cancels this run when its commit is superseded, which
    # needs write access to the Actions API (issue #112 follow-up).
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # A queued matrix job can start long after the run was created, by which
      # time the pull request may have moved on (issue #112 follow-up). Check
      # before spending a runner on a commit nobody is waiting for.
      - name: Stop if a newer commit superseded this run
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bash scripts/ci/supersede.sh stop-if-superseded
          # ...and keep watching from inside the job. Cancelling from the
          # outside needs a free runner, and a superseded run holding every
          # slot is exactly why there is none.
          setsid nohup bash scripts/ci/supersede.sh watch \
            > "$RUNNER_TEMP/supersede-watch.log" 2>&1 < /dev/null &

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx-resilient

      - name: Build full chain (JS -> essentials -> languages -> full)
        run: |
          set -e
          echo "=== Building JS box ==="
          docker build -f ubuntu/24.04/js/Dockerfile -t box-js .

          echo ""
          echo "=== Building essentials box (on JS) ==="
          docker build -f ubuntu/24.04/essentials-box/Dockerfile \
            --build-arg JS_IMAGE=box-js -t box-essentials .

          echo ""
          echo "=== Building language images (on essentials) ==="
          for lang in python go rust java kotlin ruby php perl swift lean rocq; do
            echo ""
            echo "--- Building ${lang} box ---"
            docker build -f "ubuntu/24.04/${lang}/Dockerfile" \
              --build-arg ESSENTIALS_IMAGE=box-essentials \
              -t "box-${lang}" .
          done

          echo ""
          echo "=== Building full box (multi-stage from all language images) ==="
          docker build -f ubuntu/24.04/full-box/Dockerfile \
            --build-arg ESSENTIALS_IMAGE=box-essentials \
            --build-arg PYTHON_IMAGE=box-python \
            --build-arg GO_IMAGE=box-go \
            --build-arg RUST_IMAGE=box-rust \
            --build-arg JAVA_IMAGE=box-java \
            --build-arg KOTLIN_IMAGE=box-kotlin \
            --build-arg RUBY_IMAGE=box-ruby \
            --build-arg PHP_IMAGE=box-php \
            --build-arg PERL_IMAGE=box-perl \
            --build-arg SWIFT_IMAGE=box-swift \
            --build-arg LEAN_IMAGE=box-lean \
            --build-arg ROCQ_IMAGE=box-rocq \
            -t box-test .

      - name: Test full box
        run: |
          set -e
          echo "=== Testing full box ==="
          echo "Note: Using entrypoint script which initializes all environments"

          # JavaScript/TypeScript runtimes
          docker run --rm box-test node --version
          docker run --rm box-test bun --version
          docker run --rm box-test deno --version

          # Python (pyenv)
          docker run --rm box-test python3 --version
          docker run --rm box-test pip3 --version

          # Go
          docker run --rm box-test go version

          # Rust (rustup + cargo + rustc)
          docker run --rm box-test rustc --version
          docker run --rm box-test cargo --version
          docker run --rm box-test rustup --version

          # Java/JVM (SDKMAN)
          docker run --rm box-test java -version
          docker run --rm box-test kotlin -version

          # Ruby (rbenv)
          docker run --rm box-test ruby --version
          docker run --rm box-test gem --version

          # PHP
          docker run --rm box-test php --version

          # Perl (perlbrew)
          docker run --rm box-test perl --version

          # Swift
          docker run --rm box-test swift --version

          # Lean/Mathlib (elan)
          docker run --rm box-test lean --version

          # Dotnet
          docker run --rm box-test dotnet --version

          # R language
          docker run --rm box-test Rscript --version

          # CLI tools
          docker run --rm box-test gh --version
          docker run --rm box-test glab --version
          docker run --rm box-test gh-setup-git-identity --version
          docker run --rm box-test glab-setup-git-identity --version

          # expect (interactive automation tool, issue #64)
          docker run --rm box-test expect -v

          echo ""
          echo "=== Runtime freshness and one-version-per-language invariant (issue #112) ==="
          . ubuntu/24.04/common.sh
          EXPECTED_NODE="$(resolve_node_lts_major)"
          ACTUAL_NODE="$(docker run --rm box-test node --version)"
          echo "full box ships Node $ACTUAL_NODE, expected major $EXPECTED_NODE"
          case "$ACTUAL_NODE" in
            v"$EXPECTED_NODE".*) ;;
            *) echo "::error::full box ships $ACTUAL_NODE, expected Node $EXPECTED_NODE"; exit 1 ;;
          esac

          # The stale `stable` next to a pinned toolchain is the 2.2 GB ~/.rustup
          # from issue #112: assert one toolchain, and that it is the one rustup
          # itself considers current. `rustup check` also reports updates for the
          # rustup binary, which is not what this asserts — toolchain lines only.
          docker run --rm box-test rustup toolchain list
          TOOLCHAINS="$(docker run --rm box-test rustup toolchain list | grep -c .)"
          [ "$TOOLCHAINS" -eq 1 ] \
            || { echo "::error::$TOOLCHAINS rustup toolchains in the full box, expected 1"; exit 1; }
          if docker run --rm box-test rustup check | grep -v "^rustup " | grep "Update available"; then
            echo "::error::the shipped Rust stable is not the current release"; exit 1
          fi

          docker run --rm -v "$PWD/ubuntu/24.04/common.sh:/tmp/common.sh:ro" \
            box-test bash -c '. /tmp/common.sh && assert_single_runtime_versions'

          echo ""
          echo "=== PHP install method check ==="
          docker run --rm box-php cat /home/box/.php-install-method
          docker run --rm box-test cat /home/box/.php-install-method

          echo ""
          echo "=== All full box tests passed ==="

  # --- Tier 5: dind-box variants (parallel matrix: 14 variants, one VM each) — issue #80 ---
  # Each dind variant rebuilds its base chain (JS + essentials + optional lang/full)
  # locally and then layers dind on top, so this matrix only depends on
  # pr-test-essentials having validated the base layer; it can run in parallel
  # with the per-language and full-box jobs to minimise wall-clock time.
  pr-test-dind:
    name: pr-test / dind-${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: [detect-changes, version-check, changeset-check, pr-test-version-policy, pr-test-essentials]
    if: |
      !cancelled() &&
      needs.pr-test-essentials.result == 'success' &&
      github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.should-build == 'true'
    strategy:
      fail-fast: false
      matrix:
        # variant -> base box flavour. Special value "full" rebuilds the entire chain;
        # everything else needs only JS+essentials+<lang>.
        variant: [js, essentials, python, go, rust, java, kotlin, ruby, php, perl, swift, lean, rocq, full]
    # The guard below cancels this run when its commit is superseded, which
    # needs write access to the Actions API (issue #112 follow-up).
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # A queued matrix job can start long after the run was created, by which
      # time the pull request may have moved on (issue #112 follow-up). Check
      # before spending a runner on a commit nobody is waiting for.
      - name: Stop if a newer commit superseded this run
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bash scripts/ci/supersede.sh stop-if-superseded
          # ...and keep watching from inside the job. Cancelling from the
          # outside needs a free runner, and a superseded run holding every
          # slot is exactly why there is none.
          setsid nohup bash scripts/ci/supersede.sh watch \
            > "$RUNNER_TEMP/supersede-watch.log" 2>&1 < /dev/null &

      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx-resilient

      - name: Build base box for dind variant
        run: |
          set -e
          VARIANT="${{ matrix.variant }}"

          echo "=== Building JS box (base layer) ==="
          docker build -f ubuntu/24.04/js/Dockerfile -t box-js .

          if [ "$VARIANT" = "js" ]; then
            BASE_IMAGE="box-js"
          else
            echo ""
            echo "=== Building essentials box ==="
            docker build -f ubuntu/24.04/essentials-box/Dockerfile \
              --build-arg JS_IMAGE=box-js -t box-essentials .

            if [ "$VARIANT" = "essentials" ]; then
              BASE_IMAGE="box-essentials"
            elif [ "$VARIANT" = "full" ]; then
              echo ""
              echo "=== Building all language images (full-box prerequisites) ==="
              for lang in python go rust java kotlin ruby php perl swift lean rocq; do
                echo "--- Building ${lang} box ---"
                docker build -f "ubuntu/24.04/${lang}/Dockerfile" \
                  --build-arg ESSENTIALS_IMAGE=box-essentials \
                  -t "box-${lang}" .
              done
              echo ""
              echo "=== Building full box ==="
              docker build -f ubuntu/24.04/full-box/Dockerfile \
                --build-arg ESSENTIALS_IMAGE=box-essentials \
                --build-arg PYTHON_IMAGE=box-python \
                --build-arg GO_IMAGE=box-go \
                --build-arg RUST_IMAGE=box-rust \
                --build-arg JAVA_IMAGE=box-java \
                --build-arg KOTLIN_IMAGE=box-kotlin \
                --build-arg RUBY_IMAGE=box-ruby \
                --build-arg PHP_IMAGE=box-php \
                --build-arg PERL_IMAGE=box-perl \
                --build-arg SWIFT_IMAGE=box-swift \
                --build-arg LEAN_IMAGE=box-lean \
                --build-arg ROCQ_IMAGE=box-rocq \
                -t box-full .
              BASE_IMAGE="box-full"
            else
              echo ""
              echo "=== Building ${VARIANT} box ==="
              docker build -f "ubuntu/24.04/${VARIANT}/Dockerfile" \
                --build-arg ESSENTIALS_IMAGE=box-essentials \
                -t "box-${VARIANT}" .
              BASE_IMAGE="box-${VARIANT}"
            fi
          fi

          echo "BASE_IMAGE=${BASE_IMAGE}" >> "$GITHUB_ENV"

      - name: Build dind-box variant
        run: |
          set -e
          echo "=== Building dind-${{ matrix.variant }} on ${BASE_IMAGE} ==="
          docker build -f ubuntu/24.04/dind/Dockerfile \
            --build-arg BASE_IMAGE="${BASE_IMAGE}" \
            -t "box-dind-${{ matrix.variant }}" .

      - name: Test dind-box variant
        run: |
          set -e
          IMG="box-dind-${{ matrix.variant }}"
          echo "=== Testing ${IMG} (no privileged mode in PR CI) ==="
          # Regression check for issue #88: docker exec and entrypoint-bypassed
          # shells use the image's configured USER, so dind variants must keep
          # Config.User aligned with the regular box images.
          CONFIG_USER=$(docker inspect --format '{{.Config.User}}' "$IMG")
          if [ "$CONFIG_USER" != "box" ]; then
            echo "Expected ${IMG} Config.User to be box, got '${CONFIG_USER:-<empty>}'"
            exit 1
          fi
          docker run --rm --entrypoint=/bin/bash "$IMG" -c 'test "$(whoami)" = box'
          docker run --rm --entrypoint=/bin/bash "$IMG" -c 'test "$HOME" = /home/box'
          docker run --rm --entrypoint=/bin/bash "$IMG" -c 'sudo -n /usr/bin/dockerd --version'

          # Verify Docker CLI, dockerd binary, buildx and compose plugins are present.
          # We do NOT start dockerd here because GitHub-hosted runners disallow --privileged.
          docker run --rm --entrypoint=/bin/bash "$IMG" -c 'docker --version'
          docker run --rm --entrypoint=/bin/bash "$IMG" -c 'dockerd --version'
          docker run --rm --entrypoint=/bin/bash "$IMG" -c 'docker buildx version'
          docker run --rm --entrypoint=/bin/bash "$IMG" -c 'docker compose version'
          docker run --rm --entrypoint=/bin/bash "$IMG" -c 'cat /etc/box/variant'
          echo "=== ${IMG} smoke tests passed ==="

      - name: Test documented dind examples
        if: matrix.variant == 'js'
        env:
          DIND_IMAGE: box-dind-js
          DIND_WAIT_SECONDS: "60"
        run: |
          set -e
          echo "=== Testing documented dind examples against ${DIND_IMAGE} ==="
          tests/dind/example-basic-docker-ps.sh
          tests/dind/example-commit-cycle.sh
          tests/dind/example-sudoers-extension.sh
          tests/dind/example-storage-driver-vfs.sh
          tests/dind/example-preload-images.sh
          tests/dind/example-dood-host-socket.sh
          echo "=== Documented dind examples passed ==="

  # --- Aggregator: single status check for branch protection ---
  # GitHub branch protection rules can require this one job to pass instead of
  # listing every parallel pr-test-* job individually.
  docker-build-test:
    name: docker-build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [detect-changes, version-check, changeset-check, pr-test-version-policy, pr-test-js, pr-test-essentials, pr-test-language, pr-test-full, pr-test-dind]
    if: |
      !cancelled() &&
      github.event_name == 'pull_request' &&
      needs.detect-changes.outputs.should-build == 'true'
    steps:
      - name: Aggregate pr-test results
        run: |
          set -e
          echo "pr-test-version-policy: ${{ needs.pr-test-version-policy.result }}"
          echo "pr-test-js:         ${{ needs.pr-test-js.result }}"
          echo "pr-test-essentials: ${{ needs.pr-test-essentials.result }}"
          echo "pr-test-language:   ${{ needs.pr-test-language.result }}"
          echo "pr-test-full:       ${{ needs.pr-test-full.result }}"
          echo "pr-test-dind:       ${{ needs.pr-test-dind.result }}"

          fail=0
          for r in \
            "${{ needs.pr-test-version-policy.result }}" \
            "${{ needs.pr-test-js.result }}" \
            "${{ needs.pr-test-essentials.result }}" \
            "${{ needs.pr-test-language.result }}" \
            "${{ needs.pr-test-full.result }}" \
            "${{ needs.pr-test-dind.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) fail=1 ;;
            esac
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more pr-test jobs did not succeed."
            exit 1
          fi
          echo "All pr-test jobs succeeded."

  # === BUILD JS BOX (amd64) ===
  # JS box is the base layer - built first, other images depend on it
  build-js-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: [detect-changes]
    if: |
      !cancelled() &&
      needs.detect-changes.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-changes.outputs.should-build == 'true') ||
        (github.event_name == 'workflow_dispatch')
      ) &&
      (
        needs.detect-changes.outputs.js-changed == 'true' ||
        needs.detect-changes.outputs.common-changed == 'true' ||
        needs.detect-changes.outputs.version-changed == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    permissions:
      contents: read
      packages: write
    outputs:
      built: ${{ steps.result.outputs.built }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      # Issue #82: free disk space on every build job's runner before pulling
      # base images / running buildx so that COPY --from=*-stage and large
      # apt installs never hit "no space left on device" mid-build.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Get latest version
        id: version
        run: |
          git pull origin main || true
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx-resilient

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Issue #82: tolerate Docker Hub login failure (e.g. expired DOCKERHUB_TOKEN)
      # so that pushes to GHCR still proceed instead of taking down every build job.
      - name: Log in to Docker Hub
        id: dockerhub-login
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Check Docker Hub login (issue #82)"
        if: steps.dockerhub-login.outcome != 'success'
        run: |
          echo "::warning title=Docker Hub login failed::Docker Hub login failed (outcome=${{ steps.dockerhub-login.outcome }}). The DOCKERHUB_TOKEN repository secret is most likely expired or revoked. See docs/case-studies/issue-82/CASE-STUDY.md for the rotation runbook. The job will continue and push to GHCR; guarded Docker Hub publish steps will be skipped, while unguarded Docker Hub push attempts may fail without failing the job."

      - name: Build and push JS box (amd64)
        id: build-push
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ubuntu/24.04/js/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}-js:latest-amd64
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}-js:${{ steps.version.outputs.version }}-amd64
          provenance: false
          cache-from: type=gha,scope=js-amd64
          cache-to: type=gha,scope=js-amd64,mode=max

      # Retry push on transient GHCR 403 errors (Issue #78)
      - name: Retry push JS box (amd64) on failure
        if: steps.build-push.outcome == 'failure'
        run: |
          bash scripts/release/buildx-retry.sh \
              --file ubuntu/24.04/js/Dockerfile \
              --platform linux/amd64 \
              --tag ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}-js:latest-amd64 \
              --tag ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}-js:${{ steps.version.outputs.version }}-amd64 \
              --provenance=false \
              --cache-from type=gha,scope=js-amd64 \
              --push \
              .

      # Issue #115 (RC-3): GHCR is the registry of record - it is written with
      # the per-run GITHUB_TOKEN, which cannot expire - and Docker Hub is a
      # mirror of it. Pushing both registries in one `docker buildx build --push`
      # meant a single expired DOCKERHUB_TOKEN destroyed the GHCR tags and the
      # `cache-to: type=gha` export as collateral (run 33972074755).
      - name: Mirror JS box (amd64) to Docker Hub
        if: steps.dockerhub-login.outcome == 'success'
        run: |
          bash scripts/release/mirror-to-dockerhub.sh \
            "${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}-js:${{ steps.version.outputs.version }}-amd64" \
            "${{ env.DOCKERHUB_IMAGE_NAME }}-js:latest-amd64" \
            "${{ env.DOCKERHUB_IMAGE_NAME }}-js:${{ steps.version.outputs.version }}-amd64"

      - name: Mark as built
        id: result
        run: echo "built=true" >> "$GITHUB_OUTPUT"

  # === BUILD JS BOX (arm64) ===
  build-js-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    needs: [detect-changes]
    if: |
      !cancelled() &&
      needs.detect-changes.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-changes.outputs.should-build == 'true') ||
        (github.event_name == 'workflow_dispatch')
      ) &&
      (
        needs.detect-changes.outputs.js-changed == 'true' ||
        needs.detect-changes.outputs.common-changed == 'true' ||
        needs.detect-changes.outputs.version-changed == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    permissions:
      contents: read
      packages: write
    outputs:
      built: ${{ steps.result.outputs.built }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      # Issue #82: free disk space on every build job's runner before pulling
      # base images / running buildx so that COPY --from=*-stage and large
      # apt installs never hit "no space left on device" mid-build.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Get latest version
        id: version
        run: |
