# zizmor configuration — https://docs.zizmor.sh/configuration/
#
# Mirrors the policy of the reference template
# (link-foundation/js-ai-driven-development-pipeline-template), so this
# repository and the template cannot drift apart on what counts as a finding
# (issue #115).
rules:
  unpinned-uses:
    config:
      policies:
        # These publishers are trusted at tag granularity: their release tags
        # are the reference these workflows are meant to read at a glance.
        # Everything else must be pinned to a full commit hash.
        actions/*: ref-pin
        github/*: ref-pin
        docker/*: ref-pin
        astral-sh/*: ref-pin
        lycheeverse/*: ref-pin
        zizmorcore/*: ref-pin
        changesets/*: ref-pin
        '*': hash-pin
