# hadolint configuration (issue #115).
#
# The 24 tracked Dockerfiles are the thing this repository ships, and no linter
# had ever read one. `apt install` (rather than `apt-get`) was sitting in
# ubuntu/24.04/js/Dockerfile, printing "WARNING: apt does not have a stable CLI
# interface" into every JS box build.
#
# Reproduce locally: bash scripts/ci/run-hadolint.sh

# Threshold: `info`, which is hadolint's own default and one step stricter than
# the `warning` this started at.
#
# Issue #121 is about checks that cannot fail. At `warning`, every DL3015 and
# DL3059 in this repository - ten of them - was printed as a GitHub notice on
# every run and could never turn a run red, which is the same thing as not
# checking. Those ten were resolved one site at a time (measured, not
# blanket-ignored: see experiments/measure-issue121-apt-recommends.sh and the
# `hadolint ignore=` comments, each with the measurement that justifies it), so
# the threshold can now sit where the next one will be seen.
failure-threshold: info

ignored:
  # DL3008 "Pin versions in apt get install".
  #
  # Deliberate, and the opposite of what this repository wants. Issue #112 made
  # "resolve every runtime version at build time instead of hardcoding it" the
  # policy: the boxes follow their upstreams, and an apt pin would freeze a
  # package at a version Ubuntu stops shipping, which is a build that fails on
  # a security update. The versions that do need pinning are pinned where the
  # policy says - see resolve_* in ubuntu/24.04/common.sh and the
  # NODE_VERSION / JAVA_VERSION / DOTNET_CHANNEL / ... overrides.
  - DL3008
